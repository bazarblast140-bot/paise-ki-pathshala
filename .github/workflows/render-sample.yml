name: Render sample (no upload)

# PINNED BRANCH ONLY (pinned-known-good-4beat-9579f09). Edge TTS dry render.
# No ElevenLabs key, no DeepSeek key, no YouTube/Instagram upload, no git push.
# Uploads final.mp4 and the script files as an Actions artifact only.
on:
  workflow_dispatch:
    inputs:
      topic_key:
        description: "Topic key to render"
        type: string
        default: atr_sl

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core libraqm0
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Render one Short (Edge only)
        env:
          VIDEO_FORMAT: short
          ELEVENLABS_API_KEY: ""
          DRY_RUN: "1"
        run: python board_short.py --key "${{ inputs.topic_key }}"
      - name: Upload the mp4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-edge-render
          path: |
            run/final.mp4
            run/tts_text.txt
            run/narration.json
            run/self_review.json
            run/script.txt
            run/spoken.txt
            run/thumbnail.jpg
          if-no-files-found: warn
