name: Health check

# Read-only pre-slot check. Never uploads, publishes, or posts a Reel.
# Publish slots are 08:30, 16:00, 21:00 IST. Actions cron is UTC (IST = UTC+5:30).
# Nominal lead is 90 minutes — the early edge of the 60–90 min window — so a
# late runner still lands inside that window:
#   07:00 IST = 01:30 UTC → 08:30 slot
#   14:30 IST = 09:00 UTC → 16:00 slot
#   19:30 IST = 14:00 UTC → 21:00 slot
# On warn/fail: one GitHub issue labelled health-alert (create or update, no dupes).
# When every check is ok/skip/note, that issue is closed.
# GITHUB_TOKEN is the built-in token. No new secrets are required.
on:
  schedule:
    - cron: "30 1 * * *"
    - cron: "0 9 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Which slot this check covers (auto = cron, else next upcoming)"
        type: choice
        options: ["auto", "08:30", "16:00", "21:00"]
        default: "auto"

permissions:
  contents: read
  issues: write

concurrency:
  group: health-check
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install requests
      - name: Unit tests (mocked HTTP, no secrets)
        run: python -m unittest tests.test_health_check -v
      - name: Provider health check (read-only)
        env:
          # empty on schedule; "auto" or a slot name on Run workflow
          HEALTH_SLOT: ${{ inputs.slot }}
          HEALTH_CRON: ${{ github.event.schedule }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YT_FIN_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YT_FIN_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YT_FIN_REFRESH_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          KIMI_BASE_URL: ${{ secrets.KIMI_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_SURFACE: ${{ vars.IG_SURFACE || 'facebook' }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION || 'v23.0' }}
        run: python health_check.py
