name: Publish an artifact

# Upload one run's final.mp4 as a NEW YouTube video, then cross-post the Reel.
# This does not change the privacy of a video that is already on the channel.
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Actions run id whose final.mp4 to upload as a new video"
        required: true
        type: string
      privacy:
        description: "public schedules publishAt. now is immediate public. unlisted stays unlisted."
        required: true
        type: choice
        options: [public, unlisted, now]
        default: public
      slot:
        description: "IST clock for privacy=public. 16:00 is the afternoon Short."
        required: false
        type: string
        default: "16:00"
      date_ist:
        description: "IST date YYYY-MM-DD for privacy=public. Blank uses today and refuses a missed slot."
        required: false
        type: string
        default: ""
      ig_only:
        description: "true = post only the Instagram Reel for youtube_video_id. Do not upload to YouTube again."
        required: false
        type: choice
        options: ["false", "true"]
        default: "false"
      youtube_video_id:
        description: "Existing YouTube video id. Required when ig_only=true. A Reel already logged for this id is refused."
        required: false
        type: string
        default: ""
      override_mp4_url:
        description: "Optional. Replace run/final.mp4 before YouTube and Instagram. Only https://github.com/bazarblast140-bot/paise-ki-pathshala/releases/download/<tag>/<file>.mp4"
        required: false
        type: string
        default: ""

concurrency:
  group: paise-ki-pathshala-publish
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  publish:
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -r requirements.txt
      - name: Download source artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run_id }}
        run: |
          rm -rf run
          mkdir -p run
          gh run download "$SOURCE_RUN" -D run
          if [ ! -s run/final.mp4 ]; then
            MP4="$(find run -type f -name final.mp4 -print -quit)"
            if [ -n "$MP4" ]; then
              SRC="$(dirname "$MP4")"
              cp -f "$SRC"/* run/ 2>/dev/null || true
            fi
          fi
          test -s run/final.mp4
          test -s run/script.txt
          test -s run/thumbnail.jpg
      - name: Replace final.mp4 from a release asset
        if: inputs.override_mp4_url != ''
        env:
          OVERRIDE_MP4_URL: ${{ inputs.override_mp4_url }}
          GH_TOKEN: ${{ github.token }}
        run: python override_mp4.py
      - name: Schedule publishAt
        id: when
        if: inputs.ig_only != 'true'
        env:
          PRIVACY: ${{ inputs.privacy }}
          SLOT: ${{ inputs.slot }}
          DATE_IST: ${{ inputs.date_ist }}
        run: |
          if [ "$PRIVACY" != "public" ]; then
            echo "slot=" >> "$GITHUB_OUTPUT"
            echo "date_ist=" >> "$GITHUB_OUTPUT"
            echo "publish_at=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python slot_guard.py --publish-at "$SLOT" ${DATE_IST:+"$DATE_IST"} >> "$GITHUB_OUTPUT"
      - name: Upload a new YouTube video
        if: inputs.ig_only != 'true'
        env:
          VIDEO_FORMAT: short
          PUBLISH_VISIBILITY: ${{ inputs.privacy == 'now' && 'public' || inputs.privacy }}
          PUBLISH_SLOT_IST: ${{ steps.when.outputs.slot }}
          PUBLISH_DATE_IST: ${{ steps.when.outputs.date_ist }}
          PUBLISH_AT_UTC: ${{ steps.when.outputs.publish_at }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YT_FIN_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YT_FIN_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YT_FIN_REFRESH_TOKEN }}
          EXPECTED_CHANNEL_ID: ${{ vars.YT_FIN_CHANNEL_ID }}
          APPROVED: "true"
        run: python publish.py
      - name: Cross-post the Reel
        env:
          VIDEO_FORMAT: short
          IG_CROSSPOST: "1"
          APPROVED: "true"
          IG_ONLY: ${{ inputs.ig_only }}
          YOUTUBE_VIDEO_ID: ${{ inputs.youtube_video_id }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_SURFACE: ${{ vars.IG_SURFACE || 'facebook' }}
          IG_API_VERSION: v23.0
          MEDIA_REPO: ${{ vars.MEDIA_REPO || 'bazarblast140-bot/HEYGEN--INSTAGRAM-' }}
          MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          ACTIONS_TOKEN_FOR_COMPARE: ${{ secrets.GITHUB_TOKEN }}
        run: python publish_instagram.py
      - name: Commit the ledger fill
        if: ${{ !cancelled() }}
        run: |
          if [ ! -s run/uploaded.txt ]; then
            echo "No YouTube id; ledger not committed"
            exit 0
          fi
          git add -N data/published.json
          if git diff --quiet -- data/published.json; then
            echo "Ledger unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/published.json
            git commit -m "chore: ledger fill from published artifact [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi
