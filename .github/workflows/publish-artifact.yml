name: Publish an artifact

# Upload one run's final.mp4 as a NEW YouTube video, then cross-post the Reel.
# This does not change the privacy of a video that is already on the channel.
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Actions run id whose final.mp4 to upload as a new video. Leave empty when override_mp4_url, override_thumb_url and override_script_url are all set."
        required: false
        type: string
        default: ""
      privacy:
        description: "public schedules publishAt. now is immediate public. unlisted stays unlisted."
        required: true
        type: choice
        options: [public, unlisted, now]
        default: public
      slot:
        description: "IST clock for privacy=public. 16:00 is the afternoon Short."
        required: false
        type: string
        default: "16:00"
      date_ist:
        description: "IST date YYYY-MM-DD for privacy=public. Blank uses today and refuses a missed slot."
        required: false
        type: string
        default: ""
      ig_only:
        description: "true = post only the Instagram Reel for youtube_video_id. Do not upload to YouTube again."
        required: false
        type: choice
        options: ["false", "true"]
        default: "false"
      skip_ig:
        description: "true = upload the YouTube Short only. Do not cross-post the Reel."
        required: false
        type: choice
        options: ["false", "true"]
        default: "false"
      youtube_video_id:
        description: "Existing YouTube video id. Required when ig_only=true. A Reel already logged for this id is refused."
        required: false
        type: string
        default: ""
      override_mp4_url:
        description: "Optional. Replace run/final.mp4 before YouTube and Instagram. Only https://github.com/bazarblast140-bot/paise-ki-pathshala/releases/download/<tag>/<file>.mp4"
        required: false
        type: string
        default: ""
      override_thumb_url:
        description: "Optional. Replace run/thumbnail.jpg before YouTube and Instagram. Only https://github.com/bazarblast140-bot/paise-ki-pathshala/releases/download/<tag>/<file>.jpg"
        required: false
        type: string
        default: ""
      override_script_url:
        description: "Optional. Replace run/script.txt (title, description, IG caption). Only https://github.com/bazarblast140-bot/paise-ki-pathshala/releases/download/<tag>/<file>.txt. When set, the ±1s length check against the source run is skipped."
        required: false
        type: string
        default: ""
      override_meta_url:
        description: "Optional. JSON release asset with title, description, and tags. Only https://github.com/bazarblast140-bot/paise-ki-pathshala/releases/download/<tag>/<file>.json"
        required: false
        type: string
        default: ""
      post_story:
        description: "true = also post the same mp4 as an Instagram Story after the Reel."
        required: false
        type: choice
        options: ["false", "true"]
        default: "false"
      post_fb:
        description: "true = also post final_ig.mp4 as a Facebook Reel on the Rajesh Technical Trader Page (skipped if already there)."
        required: false
        type: choice
        options: ["false", "true"]
        default: "false"
      fb_only:
        description: "true = only the Facebook Reel. No YouTube, no Instagram."
        required: false
        type: choice
        options: ["false", "true"]
        default: "false"
      fb_dry:
        description: "true = Facebook check only: list the Page's recent Reels and say whether this one would post. Posts nothing."
        required: false
        type: choice
        options: ["false", "true"]
        default: "false"

concurrency:
  group: paise-ki-pathshala-publish
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  publish:
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -r requirements.txt
      - name: Download source artifact
        if: inputs.source_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run_id }}
        run: |
          rm -rf run
          mkdir -p run
          gh run download "$SOURCE_RUN" -D run
          if [ ! -s run/final.mp4 ]; then
            MP4="$(find run -type f -name final.mp4 -print -quit)"
            if [ -n "$MP4" ]; then
              SRC="$(dirname "$MP4")"
              cp -f "$SRC"/* run/ 2>/dev/null || true
            fi
          fi
          test -s run/final.mp4
          test -s run/script.txt
          test -s run/thumbnail.jpg
          for name in final_yt.mp4 final_ig.mp4; do
            if [ ! -s "run/$name" ]; then
              found="$(find run -type f -name "$name" -print -quit)"
              if [ -n "$found" ]; then
                cp -f "$found" "run/$name"
              fi
            fi
          done
      - name: Refuse a stale build
        if: inputs.source_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python stale_guard.py
      - name: Refuse a chart Reel not captured on the signed-in box
        if: inputs.source_run_id != ''
        run: |
          # Runner builds capture TradingView without login (no EMA 20/50). Only box-built close/TA Reels publish.
          python - <<'PY'
          import json, pathlib, sys
          qa = next(iter(pathlib.Path("run").rglob("qa.json")), None)
          if qa is None:
              sys.exit(0)
          data = json.loads(qa.read_text(encoding="utf-8"))
          if data.get("kind") in ("close", "ta") and data.get("capture_mode") != "box-signed-in":
              print(f"Refused: {data.get('kind')} Reel capture_mode={data.get('capture_mode')!r}; publish box-built Reels only")
              sys.exit(1)
          PY
      - name: Download the release bundle
        if: inputs.source_run_id == ''
        env:
          OVERRIDE_MP4_URL: ${{ inputs.override_mp4_url }}
          OVERRIDE_THUMB_URL: ${{ inputs.override_thumb_url }}
          OVERRIDE_SCRIPT_URL: ${{ inputs.override_script_url }}
          OVERRIDE_META_URL: ${{ inputs.override_meta_url }}
          GH_TOKEN: ${{ github.token }}
        run: python override_mp4.py --bundle
      - name: Replace final.mp4 from a release asset
        if: inputs.override_mp4_url != '' && inputs.source_run_id != ''
        env:
          OVERRIDE_MP4_URL: ${{ inputs.override_mp4_url }}
          SKIP_DURATION_CHECK: ${{ inputs.override_script_url != '' && '1' || '0' }}
          GH_TOKEN: ${{ github.token }}
        run: python override_mp4.py
      - name: Replace thumbnail.jpg from a release asset
        if: inputs.override_thumb_url != '' && inputs.source_run_id != ''
        env:
          OVERRIDE_THUMB_URL: ${{ inputs.override_thumb_url }}
          GH_TOKEN: ${{ github.token }}
        run: python override_mp4.py --thumb
      - name: Replace script.txt from a release asset
        if: inputs.override_script_url != '' && inputs.source_run_id != ''
        env:
          OVERRIDE_SCRIPT_URL: ${{ inputs.override_script_url }}
          GH_TOKEN: ${{ github.token }}
        run: python override_mp4.py --script
      - name: Replace publish meta from a release asset
        if: inputs.override_meta_url != '' && inputs.source_run_id != ''
        env:
          OVERRIDE_META_URL: ${{ inputs.override_meta_url }}
          GH_TOKEN: ${{ github.token }}
        run: python override_mp4.py --meta
      - name: Schedule publishAt
        id: when
        if: inputs.ig_only != 'true' && inputs.fb_only != 'true'
        env:
          PRIVACY: ${{ inputs.privacy }}
          SLOT: ${{ inputs.slot }}
          DATE_IST: ${{ inputs.date_ist }}
        run: |
          if [ "$PRIVACY" != "public" ]; then
            echo "slot=" >> "$GITHUB_OUTPUT"
            echo "date_ist=" >> "$GITHUB_OUTPUT"
            echo "publish_at=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$DATE_IST" ]; then
            DATE_IST="$(TZ=Asia/Kolkata date +%Y-%m-%d)"
          fi
          python slot_guard.py --publish-at "$SLOT" "$DATE_IST" >> "$GITHUB_OUTPUT"
      - name: Upload a new YouTube video
        if: inputs.ig_only != 'true' && inputs.fb_only != 'true'
        env:
          VIDEO_FORMAT: short
          PUBLISH_VISIBILITY: ${{ inputs.privacy == 'now' && 'public' || inputs.privacy }}
          PUBLISH_SLOT_IST: ${{ steps.when.outputs.slot }}
          PUBLISH_DATE_IST: ${{ steps.when.outputs.date_ist }}
          PUBLISH_AT_UTC: ${{ steps.when.outputs.publish_at }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YT_FIN_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YT_FIN_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YT_FIN_REFRESH_TOKEN }}
          EXPECTED_CHANNEL_ID: ${{ vars.YT_FIN_CHANNEL_ID }}
          APPROVED: "true"
          EXPLICIT_PRIVACY: "1"
        run: |
          if [ -s run/final_yt.mp4 ]; then
            cp -f run/final.mp4 run/main.mp4
            cp -f run/final_yt.mp4 run/final.mp4
          fi
          python publish.py
      - name: Cross-post the Reel
        if: inputs.skip_ig != 'true' && inputs.fb_only != 'true'
        env:
          VIDEO_FORMAT: short
          IG_CROSSPOST: "1"
          APPROVED: "true"
          IG_ONLY: ${{ inputs.ig_only }}
          IG_STORY: ${{ inputs.post_story == 'true' && '1' || '0' }}
          YOUTUBE_VIDEO_ID: ${{ inputs.youtube_video_id }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_SURFACE: ${{ vars.IG_SURFACE || 'facebook' }}
          IG_API_VERSION: v23.0
          MEDIA_REPO: ${{ vars.MEDIA_REPO || 'bazarblast140-bot/HEYGEN--INSTAGRAM-' }}
          MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          ACTIONS_TOKEN_FOR_COMPARE: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s run/final_ig.mp4 ]; then
            cp -f run/final_ig.mp4 run/final.mp4
          elif [ -s run/main.mp4 ]; then
            cp -f run/main.mp4 run/final.mp4
          fi
          python publish_instagram.py
      - name: Facebook Reel
        if: ${{ !cancelled() && (inputs.post_fb == 'true' || inputs.fb_only == 'true') }}
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN || secrets.IG_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          FB_PAGE_NAME: ${{ vars.FB_PAGE_NAME || 'Rajesh Technical Trader' }}
          FB_DRY: ${{ inputs.fb_dry == 'true' && '1' || '' }}
        run: python publish_facebook.py
      - name: Commit the ledger fill
        if: ${{ !cancelled() }}
        run: |
          if [ ! -s run/uploaded.txt ]; then
            echo "No YouTube id; ledger not committed"
            exit 0
          fi
          git add -N data/published.json
          if git diff --quiet -- data/published.json; then
            echo "Ledger unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/published.json
            git commit -m "chore: ledger fill from published artifact [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi
