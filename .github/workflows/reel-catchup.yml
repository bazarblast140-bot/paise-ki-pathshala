name: Reel catch-up

# GitHub sometimes drops scheduled runs. If a news/close/TA window passed
# 20+ minutes ago with no daily-reels run today and nothing in the ledger,
# dispatch daily-reels (kind, phase=both, live). Any run today blocks it.
on:
  schedule:
    - cron: "7,27,47 3-15 * * 1-5"  # every 20 min, 08:37-21:17 IST weekdays
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: reel-catchup
  cancel-in-progress: false

jobs:
  catchup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dispatch missed Reels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python reel_catchup.py
