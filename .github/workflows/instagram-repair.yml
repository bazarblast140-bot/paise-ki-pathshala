name: Instagram Reel Repair

on:
  push:
    paths:
      - ".github/workflows/instagram-repair.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest verified short artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf run
          mkdir -p run
          gh run download 36723623534 -n short-118 -D run
          test -s run/final.mp4
          test -s run/thumbnail.jpg
          test -s run/script.txt

      - name: Install Python dependency
        run: python -m pip install requests

      - name: Publish existing short to Instagram only
        env:
          VIDEO_FORMAT: short
          IG_CROSSPOST: "1"
          IG_CROSSPOST_FORCE: "1"
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_SURFACE: ${{ vars.IG_SURFACE || 'facebook' }}
          IG_API_VERSION: v23.0
          MEDIA_REPO: ${{ vars.MEDIA_REPO || 'bazarblast140-bot/HEYGEN--INSTAGRAM-' }}
          MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: python publish_instagram.py

      - name: Upload Instagram result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-repair-result
          path: |
            run/ig_reel.txt
            run/script.txt
          if-no-files-found: warn
          retention-days: 7
