name: Instagram Reel Publish Watchdog

on:
  workflow_run:
    # Slot watch's buffer fill is the other path that uploads a Short and can
    # leave the Reel for later. A soft-fail exits 0, so this cannot be
    # failure-only: the artifact step looks for run/ig_status.txt.
    workflows: ["Paise Ki Pathshala", "Slot watch"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Paise Ki Pathshala or Slot watch run ID (optional; auto-detected for workflow_run)"
        required: false
        default: ""

# Same group as the publish workflow and the slot-watch check. A Reel retry
# waits; it does not post beside another run that is still publishing.
concurrency:
  group: paise-ki-pathshala-publish
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  retry-instagram:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download run artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.run_id || github.event.workflow_run.id }}
        run: |
          rm -rf run
          mkdir -p run
          gh run download "$SOURCE_RUN" -D run || true

          # gh may place files under an artifact-named directory.
          if [ ! -s run/final.mp4 ]; then
            MP4="$(find run -type f -name final.mp4 -print -quit)"
            if [ -n "$MP4" ]; then
              SRC="$(dirname "$MP4")"
              cp -f "$SRC"/* run/ 2>/dev/null || true
            fi
          fi

          # Safety gates (a retry must never post a second Reel, a Reel for an
          # unlisted test, or a video that failed QA / review):
          #  1. ig_reel.txt already present means this Short was posted;
          #  2. ig_status.txt must start with "skipped:" — written only after a
          #     YouTube upload when the Reel was not confirmed. Unlisted tests
          #     and blocked modes never write that file.
          #  publish_instagram.py additionally refuses unless report.md,
          #  verify_meta.json, and self_review.json agree the verdict is READY.
          #  Those files are in the run's artifact. The gate is unchanged.
          STATUS="$(find run -type f -name ig_status.txt -print -quit)"
          REEL="$(find run -type f -name ig_reel.txt -size +0 -print -quit)"
          if [ -n "$REEL" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Run already published a Reel (ig_reel.txt present); not posting again."
          elif [ -z "$STATUS" ] || ! grep -q '^skipped:' "$STATUS"; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No skipped Instagram status; not posting a Reel."
          elif [ -s run/final.mp4 ] && [ -s run/script.txt ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Short artifact has a skipped Reel; Instagram-only retry is eligible."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No usable short artifact; nothing to retry."
          fi

      - name: Install dependencies
        if: steps.artifact.outputs.ready == 'true'
        run: python -m pip install -r requirements.txt

      - name: Publish Reel only
        if: steps.artifact.outputs.ready == 'true'
        env:
          VIDEO_FORMAT: short
          IG_CROSSPOST: "1"
          IG_CROSSPOST_FORCE: "1"
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_SURFACE: ${{ vars.IG_SURFACE || 'facebook' }}
          IG_API_VERSION: v23.0
          MEDIA_REPO: ${{ vars.MEDIA_REPO || 'bazarblast140-bot/HEYGEN--INSTAGRAM-' }}
          MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          ACTIONS_TOKEN_FOR_COMPARE: ${{ secrets.GITHUB_TOKEN }}
        run: python publish_instagram.py

      - name: Upload verified Instagram ID
        if: always() && steps.artifact.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: instagram-retry-result-${{ github.run_id }}
          path: |
            run/ig_reel.txt
            run/script.txt
          if-no-files-found: warn
          retention-days: 14
