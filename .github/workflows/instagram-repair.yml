name: Instagram Reel Publish Watchdog

on:
  workflow_run:
    workflows: ["Paise Ki Pathshala"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Failed Paise Ki Pathshala run ID (optional; auto-detected for workflow_run)"
        required: false
        default: ""

permissions:
  actions: read
  contents: read

jobs:
  retry-instagram:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download failed run artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_RUN: ${{ inputs.run_id || github.event.workflow_run.id }}
        run: |
          rm -rf run
          mkdir -p run
          gh run download "$FAILED_RUN" -D run || true

          # gh may place files under an artifact-named directory.
          if [ ! -s run/final.mp4 ]; then
            MP4="$(find run -type f -name final.mp4 -print -quit)"
            if [ -n "$MP4" ]; then
              SRC="$(dirname "$MP4")"
              cp -f "$SRC"/* run/ 2>/dev/null || true
            fi
          fi

          if [ -s run/final.mp4 ] && [ -s run/script.txt ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Short artifact found; Instagram-only retry is eligible."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No usable short artifact in failed run; nothing to retry."
          fi

      - name: Install dependencies
        if: steps.artifact.outputs.ready == 'true'
        run: python -m pip install -r requirements.txt

      - name: Publish Reel only
        if: steps.artifact.outputs.ready == 'true'
        env:
          VIDEO_FORMAT: short
          IG_CROSSPOST: "1"
          IG_CROSSPOST_FORCE: "1"
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_SURFACE: ${{ vars.IG_SURFACE || 'facebook' }}
          IG_API_VERSION: v23.0
          MEDIA_REPO: ${{ vars.MEDIA_REPO || 'bazarblast140-bot/HEYGEN--INSTAGRAM-' }}
          MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: python publish_instagram.py

      - name: Upload verified Instagram ID
        if: always() && steps.artifact.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: instagram-retry-result-${{ github.run_id }}
          path: |
            run/ig_reel.txt
            run/script.txt
          if-no-files-found: warn
          retention-days: 14
