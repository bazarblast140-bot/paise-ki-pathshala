name: Daily Reels

# News, close and TA (Mon-Fri). Recap is manual-only. Build and publish are separate crons.
# A dry_run does not call Gemini and does not publish.
# Live runs start Mon 12 Oct 2026 (recap Sat 10 Oct). A hard gate is a HOLD.
on:
  schedule:
    - cron: "50 2 * * 1-5"   # news build 08:20 IST Mon-Fri
    - cron: "15 3 * * 1-5"   # news publish 08:45 IST Mon-Fri
    - cron: "20 10 * * 1-5"  # close build 15:50 IST Mon-Fri
    - cron: "45 10 * * 1-5"  # close publish 16:15 IST Mon-Fri
    - cron: "35 12 * * 1-5"  # ta build 18:05 IST Mon-Fri
    - cron: "0 13 * * 1-5"   # ta publish 18:30 IST Mon-Fri
  workflow_dispatch:
    inputs:
      kind:
        description: "Which Reel to build or publish"
        required: true
        type: choice
        options: [news, close, ta, recap]
      dry_run:
        description: "true = silence, no Gemini, no upload"
        required: false
        type: boolean
        default: true
      phase:
        description: "build uploads the artifact. publish sends it. both does both."
        required: false
        type: choice
        options: [build, publish, both]
        default: build

run-name: daily-reel ${{ github.event_name == 'workflow_dispatch' && inputs.kind || github.event.schedule }} ${{ github.event_name == 'workflow_dispatch' && inputs.phase || 'cron' }}

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  # Kill switch: repo Actions variable PAUSE_KINDS (comma list, e.g. "close,ta")
  # skips those kinds cleanly. Unset or empty = everything runs.
  gate:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.g.outputs.skip }}
    steps:
      - id: g
        env:
          PAUSE_KINDS: ${{ vars.PAUSE_KINDS }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            KIND="${{ inputs.kind }}"
          else
            case "${{ github.event.schedule }}" in
              "50 2 * * 1-5"|"15 3 * * 1-5") KIND=news ;;
              "20 10 * * 1-5"|"45 10 * * 1-5") KIND=close ;;
              "35 12 * * 1-5"|"0 13 * * 1-5") KIND=ta ;;
              *) KIND=unknown ;;
            esac
          fi
          SKIP=0
          for k in $(echo "$PAUSE_KINDS" | tr ',' ' '); do
            if [ "$k" = "$KIND" ]; then SKIP=1; fi
          done
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "[gate] kind=$KIND PAUSE_KINDS='$PAUSE_KINDS' skip=$SKIP"
  reel:
    needs: gate
    if: needs.gate.outputs.skip != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg, fonts and Playwright
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core libraqm0 libfribidi0 tesseract-ocr
          pip install -r requirements.txt playwright
          playwright install chromium --with-deps
          # Captions use the bundled assets/fonts/Hind-*.ttf (Latin + Devanagari).
          # Fail the job before rendering if it is missing or cannot shape Hindi.
          python -c "from realchart.fonts import tofu_faults; f = tofu_faults(['Rajesh Technical Trader ko follow करो']); print(f or 'fonts ok'); raise SystemExit(1 if f else 0)"
      - name: Resolve kind and phase
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            KIND="${{ inputs.kind }}"
            PHASE="${{ inputs.phase }}"
            if [ "${{ inputs.dry_run }}" = "true" ]; then DRY=1; else DRY=0; fi
          else
            DRY=0
            case "${{ github.event.schedule }}" in
              "50 2 * * 1-5") KIND=news; PHASE=build ;;
              "15 3 * * 1-5") KIND=news; PHASE=publish ;;
              "20 10 * * 1-5") KIND=close; PHASE=build ;;
              "45 10 * * 1-5") KIND=close; PHASE=publish ;;
              "35 12 * * 1-5") KIND=ta; PHASE=build ;;
              "0 13 * * 1-5") KIND=ta; PHASE=publish ;;
              *) echo "Unknown schedule"; exit 1 ;;
            esac
          fi
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          echo "phase=$PHASE" >> "$GITHUB_OUTPUT"
          echo "dry=$DRY" >> "$GITHUB_OUTPUT"
          echo "[realchart] kind=$KIND phase=$PHASE dry=$DRY"
      - name: Build the Reel
        id: build
        if: steps.plan.outputs.phase != 'publish'
        env:
          REALCHART_NO_ALERT: ${{ steps.plan.outputs.dry == '1' && '1' || '0' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GEMINI_API_KEY: ${{ steps.plan.outputs.dry == '1' && '' || secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ steps.plan.outputs.dry == '1' && '' || secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ steps.plan.outputs.dry == '1' && '' || secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ steps.plan.outputs.dry == '1' && '' || secrets.GEMINI_API_KEY_4 }}
        run: |
          set +e
          if [ "${{ steps.plan.outputs.dry }}" = "1" ]; then
            python -m realchart run --kind "${{ steps.plan.outputs.kind }}" --dry-run --out run
          else
            python -m realchart run --kind "${{ steps.plan.outputs.kind }}" --out run
          fi
          code=$?
          set -e
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          if [ -s run/qa.json ]; then
            echo "[realchart] qa.json:"
            cat run/qa.json
          fi
          if [ -s run/source.md ]; then
            echo "[realchart] source.md:"
            cat run/source.md
          fi
          if [ "${{ steps.plan.outputs.dry }}" = "1" ]; then
            if [ -s run/final.mp4 ]; then echo "code=0" >> "$GITHUB_OUTPUT"; else echo "code=skip" >> "$GITHUB_OUTPUT"; fi
            # A dry HOLD is exit 2 and still uploads. Any other non-zero exit is a crash.
            if [ "$code" != "0" ] && [ "$code" != "2" ]; then
              exit "$code"
            fi
            exit 0
          fi
          if [ "$code" != "0" ]; then
            echo "code=$code" >> "$GITHUB_OUTPUT"
            exit "$code"
          fi
          if [ ! -s run/final.mp4 ]; then
            echo "code=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "code=0" >> "$GITHUB_OUTPUT"
      - name: Upload the Reel artifact
        if: always() && steps.plan.outputs.phase != 'publish'
        uses: actions/upload-artifact@v4
        with:
          name: realchart-${{ steps.plan.outputs.kind }}
          if-no-files-found: warn
          path: |
            run/final.mp4
            run/final_yt.mp4
            run/final_ig.mp4
            run/script.txt
            run/thumbnail.jpg
            run/source.md
            run/qa.json
            run/levels.json
            run/chart-capture.png
            run/chart-capture.txt
            run/chart-5m-capture.png
            run/chart-5m-capture.txt
            run/chart-15m-capture.png
            run/chart-15m-capture.txt
            run/HOLD
            run/SKIP
      - name: Publish via publish-artifact
        if: steps.plan.outputs.dry != '1' && steps.plan.outputs.phase != 'build' && (steps.plan.outputs.phase == 'publish' || steps.build.outputs.code == '0')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KIND: ${{ steps.plan.outputs.kind }}
          PHASE: ${{ steps.plan.outputs.phase }}
        run: |
          # Plain string compare, no jq regex: an escaped star was an invalid escape (run 38704739889).
          if [ "$PHASE" = "both" ]; then
            SOURCE="$GITHUB_RUN_ID"
          else
            case "$KIND" in
              news) CRON="50 2 * * 1-5" ;;
              close) CRON="20 10 * * 1-5" ;;
              ta) CRON="35 12 * * 1-5" ;;
            esac
            # Today-only (IST): never publish a stale build (30-Oct tried the 14-Oct news build).
            SOURCE="$(gh run list --workflow daily-reels.yml --limit 40 --json databaseId,displayTitle,conclusion,createdAt \
              | python3 scripts/pick_fresh_build.py "$KIND" "$CRON")"
            if [ -z "$SOURCE" ] || [ "$SOURCE" = "null" ]; then
              echo "No successful $KIND build from today to publish"
              exit 0
            fi
          fi
          if [ -z "$SOURCE" ] || [ "$SOURCE" = "null" ]; then
            echo "No successful $KIND build to publish"
            exit 1
          fi
          echo "Publishing run $SOURCE as $KIND (privacy=now, story on)"
          gh workflow run publish-artifact.yml --ref "${GITHUB_REF_NAME:-main}" \
            -f "source_run_id=$SOURCE" \
            -f privacy=now \
            -f skip_ig=false \
            -f ig_only=false \
            -f post_story=true
