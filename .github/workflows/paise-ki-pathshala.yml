name: Paise Ki Pathshala

# Hindi personal-finance channel. Secrets: DEEPSEEK_API_KEY, PEXELS_API_KEY,
# TELEGRAM_*, YT_FIN_* (python youtube_auth.py --set-github-secret),
# ELEVENLABS_*, IG_ACCESS_TOKEN, optional YT_DATA_API_KEY (competitor research).
# Variables: YT_FIN_CHANNEL_ID, IG_USER_ID, optional SELF_REPAIR.
on:
  # Build 12–14h AHEAD of the slot. YouTube publishAt is the public time.
  # Nine triggers, odd minutes, none in 22:30–01:30 UTC (GitHub's busiest
  # hours; :00 and :30 are dropped there too). Any firing run builds the
  # earliest unfilled slot inside a 26h lookahead, at least 2h ahead.
  # Still 3 public slots. Each slot has 3 chances in its 12–14h window.
  # 3 Oct 08:30 is built on the evening of 2 Oct. One slot per run.
  # 08:30 IST = 03:00 UTC. 16:00 IST = 10:30 UTC. 21:00 IST = 15:30 UTC.
  #
  #   01:47 UTC = 07:17 IST  → 21:00 in 13h43m
  #   02:23 UTC = 07:53 IST  → 21:00 in 13h07m
  #   03:13 UTC = 08:43 IST  → 21:00 in 12h17m
  #   13:07 UTC = 18:37 IST  → next 08:30 in 13h53m
  #   13:47 UTC = 19:17 IST  → next 08:30 in 13h13m
  #   14:23 UTC = 19:53 IST  → next 08:30 in 12h37m
  #   20:37 UTC = 02:07 IST  → 16:00 in 13h53m
  #   21:13 UTC = 02:43 IST  → 16:00 in 13h17m
  #   21:47 UTC = 03:17 IST  → 16:00 in 12h43m
  schedule:
    - cron: "47 1 * * *"    # 07:17 IST → 21:00
    - cron: "23 2 * * *"    # 07:53 IST → 21:00
    - cron: "13 3 * * *"    # 08:43 IST → 21:00
    - cron: "7 13 * * *"    # 18:37 IST → next 08:30
    - cron: "47 13 * * *"   # 19:17 IST → next 08:30
    - cron: "23 14 * * *"   # 19:53 IST → next 08:30
    - cron: "37 20 * * *"   # 02:07 IST → 16:00
    - cron: "13 21 * * *"   # 02:43 IST → 16:00
    - cron: "47 21 * * *"   # 03:17 IST → 16:00
  # NOTE: no `push:` trigger on purpose. A push that touched this file used to
  # start a PUBLIC upload with no slot and no slot guard (inputs are empty on
  # push, so the format step falls back to short + public). Between 30-Sep and
  # 01-Oct-2026 every "chore: trigger ..." comment commit published a Short and
  # a Reel this way. To test, use Run workflow (privacy = unlisted).
  workflow_call:
    inputs:
      format:
        type: string
        default: short
      privacy:
        type: string
        default: public
      topic_key:
        type: string
        default: ""
      beats:
        description: "Live Short length. four is the scheduled default. six is the override."
        type: string
        default: "four"
      approved:
        description: "Publish a soft REVIEW. Hard gates still block."
        type: boolean
        default: false
      narration_from_run:
        description: "Dry-run Actions id. Voice that edge-dry-run script. No new DeepSeek narration."
        type: string
        default: ""
      render_only:
        description: "Render and upload the Actions artifact. Do not upload to YouTube or Instagram."
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      format:
        description: "long (16:9, ~5 min) ya short (9:16, ~50s)"
        type: choice
        options: [short, long]
        default: short
      privacy:
        description: "unlisted = test; public = agle slot par; now = abhi turant public"
        type: choice
        options: [unlisted, public, now]
        default: unlisted
      topic_key:
        description: "TEST: sirf ye topic (jaise titan_2010); rotation me used mark nahi hota"
        required: false
        default: ""
      beats:
        description: "Live Short beats. four (~55s, default) ya six. Blank on a schedule uses config.json live_beats."
        type: choice
        options: [four, six]
        default: four
      approved:
        description: "Publish a soft REVIEW. Hard gates still block. A schedule uses vars.AUTO_APPROVE_REVIEW."
        type: choice
        options: ["false", "true"]
        default: "false"
      narration_from_run:
        description: "Dry-run Actions id (for example 37095205924). Voice that script with Rudra. No new DeepSeek narration."
        type: string
        default: ""
      render_only:
        description: "true = mp4, cover, and beat frames as an Actions artifact. No YouTube and no Reel."
        type: choice
        options: ["false", "true"]
        default: "false"
concurrency:
  # One group for every trigger. The next run waits; it does not cancel the
  # run already building a slot. That run re-reads the ledger after checkout
  # and again before upload, so two overlapping runs cannot fill one slot.
  group: paise-ki-pathshala-publish
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
  actions: read
jobs:
  build-video:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg & fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core libraqm0
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Re-read ledger after checkout
        run: |
          # Setup above can take several minutes. Fetch the ledger again so
          # the picker sees a fill or a hold that landed after checkout.
          branch="${GITHUB_REF_NAME:-main}"
          git fetch origin "$branch"
          git checkout "origin/$branch" -- data/published.json
      - name: Format decide karo
        id: fmt
        run: |
          F="${{ inputs.format }}"
          VIS="${{ inputs.privacy }}"
          if [ -z "$F" ]; then
            F=short
            VIS=public
          fi
          IMMEDIATE=0
          if [ "$VIS" = "now" ]; then
            VIS=public
            IMMEDIATE=1
          fi
          echo "format=$F" >> "$GITHUB_OUTPUT"
          echo "visibility=$VIS" >> "$GITHUB_OUTPUT"
          RO="${{ inputs.render_only }}"
          case "$RO" in
            true|True|TRUE|1) RO=true ;;
            *) RO=false ;;
          esac
          echo "render_only=$RO" >> "$GITHUB_OUTPUT"
          if [ "$IMMEDIATE" = "1" ]; then
            echo "slot=" >> "$GITHUB_OUTPUT"
            echo "date_ist=" >> "$GITHUB_OUTPUT"
            echo "publish_at=" >> "$GITHUB_OUTPUT"
            echo "taken=false" >> "$GITHUB_OUTPUT"
          elif [ "$VIS" = "public" ]; then
            # Earliest unfilled slot inside the 26h lookahead, at least 2h ahead.
            python slot_guard.py --next >> "$GITHUB_OUTPUT"
          else
            echo "slot=" >> "$GITHUB_OUTPUT"
            echo "date_ist=" >> "$GITHUB_OUTPUT"
            echo "publish_at=" >> "$GITHUB_OUTPUT"
            echo "taken=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Slot pehle se bhara hai kya
        id: guard
        run: |
          echo "taken=${{ steps.fmt.outputs.taken }}" >> "$GITHUB_OUTPUT"
          echo "slot=${{ steps.fmt.outputs.slot }} date=${{ steps.fmt.outputs.date_ist }} publish_at=${{ steps.fmt.outputs.publish_at }} taken=${{ steps.fmt.outputs.taken }}"
      - name: Preflight (compile + unit tests, no network)
        run: |
          python -m py_compile *.py
          # Simulated failures must not emit ::error. That annotation was
          # showing a Testing-app token expiry on jobs whose token check passed.
          SUPPRESS_GHA_COMMANDS=1 PYTHONPATH=. python -m unittest discover -s tests
      - name: DeepSeek balance (log only, no upload)
        if: steps.guard.outputs.taken != 'true'
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
        run: python health_check.py --deepseek-balance
      - name: YouTube token health check (no upload)
        id: yt_token
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YT_FIN_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YT_FIN_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YT_FIN_REFRESH_TOKEN }}
        run: python yt_credentials.py
      - name: Competitor + own-channel research (optional, read-only)
        if: steps.guard.outputs.taken != 'true'
        continue-on-error: true
        timeout-minutes: 5
        env:
          YT_DATA_API_KEY: ${{ secrets.YT_DATA_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YT_FIN_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YT_FIN_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YT_FIN_REFRESH_TOKEN }}
          EXPECTED_CHANNEL_ID: ${{ vars.YT_FIN_CHANNEL_ID }}
        run: python competitor_research.py --max-age-hours 20
      - name: Download approved dry-run script
        if: steps.guard.outputs.taken != 'true' && inputs.narration_from_run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run:           python approved_script.py --download "${{ inputs.narration_from_run }}" --dest run/approved_script
      - name: Lock the committed approved beats
        if: steps.guard.outputs.taken != 'true' && inputs.narration_from_run && inputs.topic_key
        env:
          APPROVED_SCRIPT_DIR: run/approved_script
          TOPIC_KEY: ${{ inputs.topic_key }}
        run: python -c "import os, approved_script; approved_script.install_repo_beats(os.environ['APPROVED_SCRIPT_DIR'], os.environ['TOPIC_KEY'])"
      - name: Run Pipeline (+ publish if READY)
        id: pipeline
        # A failed build must still reach the buffer step. auto_agent fills
        # when it can classify the failure; this step covers a crash before
        # that hook. continue-on-error keeps the job moving so an empty slot
        # can be filled, and a later buffer failure still fails the job.
        continue-on-error: true
        if: steps.guard.outputs.taken != 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          KIMI_BASE_URL: ${{ secrets.KIMI_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # LLM/deterministic code self-repair inside CI (patches + pushes to main)
          # is OFF unless repo variable SELF_REPAIR is set to 1. See auto_agent.py.
          SELF_REPAIR: ${{ vars.SELF_REPAIR || '0' }}
          SELF_HEAL_MODEL: deepseek-flash
          SELF_HEAL_FALLBACK_MODEL: claude-haiku-4-5-20251001
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YT_FIN_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YT_FIN_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YT_FIN_REFRESH_TOKEN }}
          EXPECTED_CHANNEL_ID: ${{ vars.YT_FIN_CHANNEL_ID }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PAID_TTS_ENABLED: ${{ vars.PAID_TTS_ENABLED }}
          ELEVENLABS_VOICE_ID: ${{ inputs.narration_from_run && 'ypnkIsDASPgHZuanrF0q' || secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
          # auto_agent fills from the buffer when the build fails. That fetch
          # needs the repo identity; the secret alone is not a voice switch.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PUBLISH_VISIBILITY: ${{ steps.fmt.outputs.visibility }}
          TOPIC_KEY: ${{ inputs.topic_key }}
          LIVE_BEATS: ${{ inputs.beats }}
          PUBLISH_SLOT_IST: ${{ steps.fmt.outputs.slot }}
          PUBLISH_DATE_IST: ${{ steps.fmt.outputs.date_ist }}
          PUBLISH_AT_UTC: ${{ steps.fmt.outputs.publish_at }}
          # Reel only for PUBLIC runs: an unlisted test must not post a public Reel.
          IG_CROSSPOST: ${{ steps.fmt.outputs.format == 'short' && steps.fmt.outputs.visibility == 'public' && steps.fmt.outputs.render_only != 'true' && '1' || '0' }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_SURFACE: ${{ vars.IG_SURFACE || 'facebook' }}
          MEDIA_REPO: ${{ vars.MEDIA_REPO || 'bazarblast140-bot/HEYGEN--INSTAGRAM-' }}
          MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          # Compared to MEDIA_REPO_TOKEN so a GITHUB_TOKEN fallback is logged
          # by name. The value is never printed.
          ACTIONS_TOKEN_FOR_COMPARE: ${{ secrets.GITHUB_TOKEN }}
          # Soft REVIEW may publish only when this is true. A schedule reads
          # vars.AUTO_APPROVE_REVIEW (empty means false). A manual or called
          # run uses the approved input, default false. Hard gates ignore it.
          APPROVED: ${{ github.event_name == 'schedule' && vars.AUTO_APPROVE_REVIEW || inputs.approved }}
          NARRATION_FROM_RUN: ${{ inputs.narration_from_run }}
          APPROVED_SCRIPT_DIR: run/approved_script
        run: |
          if [ "${{ steps.fmt.outputs.render_only }}" = "true" ]; then
            python auto_agent.py --format ${{ steps.fmt.outputs.format }}
          else
            python auto_agent.py --format ${{ steps.fmt.outputs.format }} --publish
          fi
      - name: Buffer fill if this slot is still empty
        id: buffer
        if: always() && steps.guard.outputs.taken != 'true' && steps.fmt.outputs.render_only != 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YT_FIN_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YT_FIN_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YT_FIN_REFRESH_TOKEN }}
          EXPECTED_CHANNEL_ID: ${{ vars.YT_FIN_CHANNEL_ID }}
          PUBLISH_VISIBILITY: ${{ steps.fmt.outputs.visibility }}
          PUBLISH_SLOT_IST: ${{ steps.fmt.outputs.slot }}
          PUBLISH_DATE_IST: ${{ steps.fmt.outputs.date_ist }}
          PUBLISH_AT_UTC: ${{ steps.fmt.outputs.publish_at }}
          IG_CROSSPOST: ${{ steps.fmt.outputs.format == 'short' && steps.fmt.outputs.visibility == 'public' && '1' || '0' }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_SURFACE: ${{ vars.IG_SURFACE || 'facebook' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          APPROVED: ${{ github.event_name == 'schedule' && vars.AUTO_APPROVE_REVIEW || inputs.approved }}
        run: python buffer_shorts.py --fill-scheduled
      - name: YouTube upload recorded
        id: uploaded
        if: ${{ !cancelled() && steps.guard.outputs.taken != 'true' }}
        run: |
          id=""
          if [ -s run/uploaded.txt ]; then
            id="$(tr -d '\r' < run/uploaded.txt | head -n 1 | awk '{print $1}')"
          fi
          if [ -n "$id" ]; then
            echo "youtube_uploaded=true" >> "$GITHUB_OUTPUT"
            echo "video_id=$id" >> "$GITHUB_OUTPUT"
          else
            echo "youtube_uploaded=false" >> "$GITHUB_OUTPUT"
            echo "video_id=" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit topic_bank (prevent topic repeats)
        # An Instagram miss used to fail the job after YouTube had already
        # uploaded, and success() then skipped this commit. The next cron saw
        # an empty slot and uploaded again. Commit whenever a video id exists.
        # A narration-gate failure writes data/gate_skips.json. That skip has
        # to land too, or the next run picks the same blocked topic.
        if: ${{ !cancelled() && steps.guard.outputs.taken != 'true' && (steps.uploaded.outputs.youtube_uploaded == 'true' || success() || steps.buffer.outcome == 'success' || steps.pipeline.outcome == 'failure') }}
        run: |
          FILES=""
          for f in topic_bank.json data/published.json data/buffer_manifest.json data/gate_skips.json data/competitor_insights.json \
                   data/competitor_performance.json data/own_topic_performance.json; do
            [ -e "$f" ] && FILES="$FILES $f"
          done
          git add -N $FILES
          if git diff --quiet -- $FILES; then
            echo "No topic_bank / ledger / research changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add $FILES
            git commit -m "chore: topic + ledger update [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi
      - name: Upload video + report as artifact
        if: ${{ always() && steps.guard.outputs.taken != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.fmt.outputs.format }}-${{ github.run_number }}
          path: |
            run/final.mp4
            run/thumbnail.jpg
            run/sc_*.png
            run/report.md
            run/verify_meta.json
            run/self_review.json
            run/script.txt
            run/spoken.txt
            run/tts_text.txt
            run/gate1_report.txt
            run/gate2_report.txt
            run/gate3_report.txt
            run/ig_reel.txt
            run/ig_status.txt
            run/ig_cover.jpg
            run/uploaded.txt
            run/youtube_status.txt
            run/auto_agent_last.log
            run/credits.json
            run/narration_block.json
            run/voice.wav
          retention-days: 14
