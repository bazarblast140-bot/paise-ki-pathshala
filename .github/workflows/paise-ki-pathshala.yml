name: Paise Ki Pathshala

# Hindi personal-finance channel. Secrets: DEEPSEEK_API_KEY, PEXELS_API_KEY,
# TELEGRAM_*, YT_FIN_* (yt_token_to_github.py --prefix YT_FIN), variable
# YT_FIN_CHANNEL_ID — publish.py isse check karta hai ki token sahi channel ka hai.
#
# Do format: long (16:9, ~5 min) aur short (9:16, ~50s, bina intro). Har topic
# ka ek short aur ek long banta hai (topic_bank: used / used_short).
#
# Roz 3 Shorts, public at:
#   premarket 08:30 IST, postmarket 16:00 IST, night 21:00 IST
#
# GitHub Actions cron late chal sakta hai (kabhi 1-6 ghante). Isliye build
# target se ~1.5–6h pehle fire hota hai. Upload private + publishAt se hota
# hai — YouTube theek slot ke time public karta hai.
#
# 15-Sep-2026: purane cron (07/14:30/19:30 UTC) slot ke baad fire ho rahe the
# → publishAt next-day ban jata tha. Ab early + matching SLOT.
on:
  schedule:
    - cron: "0 2 * * *"      # ~07:30 IST → premarket  08:30 IST
    - cron: "0 8 * * *"      # ~13:30 IST → postmarket 16:00 IST
    - cron: "0 13 * * *"     # ~18:30 IST → night      21:00 IST
  workflow_dispatch:
    inputs:
      format:
        description: "long (16:9, ~5 min) ya short (9:16, ~50s)"
        type: choice
        options: [short, long]
        default: short
      privacy:
        description: "unlisted = test; public = agle slot par; now = abhi turant public"
        type: choice
        options: [unlisted, public, now]
        default: unlisted
      topic_key:
        description: "TEST: sirf ye topic (jaise titan_2010); rotation me used mark nahi hota"
        required: false
        default: ""

# Short aur long alag group — ek dusre ko block na karein.
concurrency:
  group: paise-ki-pathshala-${{ github.event.schedule || inputs.format }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-video:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # fonts-noto-core = Devanagari captions (libass); libraqm0 = PIL me sahi matra
      - name: Install FFmpeg & fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core libraqm0

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Format decide karo
        id: fmt
        run: |
          F="${{ inputs.format }}"
          VIS="${{ inputs.privacy }}"
          SLOT=""
          if [ -z "$F" ]; then
            F=short; VIS=public
            case "${{ github.event.schedule }}" in
              "0 2 * * *")   SLOT="08:30" ;;
              "0 8 * * *")   SLOT="16:00" ;;
              "0 13 * * *")  SLOT="21:00" ;;
            esac
          elif [ "$VIS" = "now" ]; then
            VIS=public; SLOT=""          # turant public, koi publishAt nahi
          elif [ "$VIS" = "public" ]; then
            # manual public: next of the three slots
            H=$(TZ=Asia/Kolkata date +%H%M)
            if   [ "$H" -lt 0810 ]; then SLOT="08:30"
            elif [ "$H" -lt 1540 ]; then SLOT="16:00"
            elif [ "$H" -lt 2040 ]; then SLOT="21:00"
            else SLOT="08:30"; fi
          fi
          echo "format=$F" >> "$GITHUB_OUTPUT"
          echo "visibility=$VIS" >> "$GITHUB_OUTPUT"
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "format: $F  visibility: $VIS  slot: $SLOT"

      - name: Run Pipeline (+ publish if READY)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          KIMI_BASE_URL: ${{ secrets.KIMI_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YT_FIN_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YT_FIN_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YT_FIN_REFRESH_TOKEN }}
          EXPECTED_CHANNEL_ID: ${{ vars.YT_FIN_CHANNEL_ID }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
          PUBLISH_VISIBILITY: ${{ steps.fmt.outputs.visibility }}
          TOPIC_KEY: ${{ inputs.topic_key }}
          PUBLISH_SLOT_IST: ${{ steps.fmt.outputs.slot }}
        run: python run_pipeline.py --format ${{ steps.fmt.outputs.format }} --publish

      - name: Commit topic_bank (prevent topic repeats)
        if: success()
        run: |
          if git diff --quiet topic_bank.json; then
            echo "No topic_bank changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add topic_bank.json
            git commit -m "chore: mark topic used [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi

      - name: Upload video + report as artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.fmt.outputs.format }}-${{ github.run_number }}
          path: |
            run/final.mp4
            run/thumbnail.jpg
            run/report.md
            run/script.txt
            run/spoken.txt
            run/tts_text.txt
            run/gate1_report.txt
            run/gate2_report.txt
            run/gate3_report.txt
          retention-days: 14
