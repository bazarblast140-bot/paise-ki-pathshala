name: Paise Ki Pathshala
# recovery-v4: autonomous self-repair engine live
# recovery-v5: continuous TTS boundary-silence repair
# recovery-v6: stabilize Anthropic self-repair API
# recovery-v7: execute the recovery job on the next workflow-file push
# recovery-v8: run after watchdog dependency + board syntax repair
# recovery-v9: trim only outer TTS silence so speech is not truncated at internal pauses
# recovery-v10: retest duration-safe Edge TTS fallback
# recovery-v11: deterministic final.mp4 duration hard gate
# recovery-v12: execute publish flag and require platform confirmation
# recovery-v13: validate ElevenLabs with the actual TTS request, not subscription preflight
# recovery-v14: fresh production verification after actual ElevenLabs TTS validation
# recovery-v16: ElevenLabs-only voice engine, no mixed Edge fallback
# recovery-v17: fresh production run after ElevenLabs-only enforcement
# recovery-v18: verify faster ElevenLabs Shorts voice pacing
# recovery-v19: remove artificial 56s speech stretching
# recovery-v20: fresh production run + unique option-spread payoff visuals
# recovery-v21: candle-pattern beats must explain one idea per scene, no repeated full chart
# recovery-v22: enforce one continuous teaching sequence in narration (topic -> identify -> meaning -> action)
on:
  schedule:
    - cron: "0 3 * * *"
    - cron: "30 10 * * *"
    - cron: "30 15 * * *"
  push:
    paths:
      - ".github/workflows/paise-ki-pathshala.yml"
  workflow_call:
    inputs:
      format:
        type: string
        default: short
      privacy:
        type: string
        default: public
      topic_key:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      format:
        description: "long (16:9, ~5 min) ya short (9:16, ~50s)"
        type: choice
        options: [short, long]
        default: short
      privacy:
        description: "unlisted = test; public = agle slot par; now = abhi turant public"
        type: choice
        options: [unlisted, public, now]
        default: unlisted
      topic_key:
        description: "TEST: sirf ye topic (jaise titan_2010); rotation me used mark nahi hota"
        required: false
        default: ""
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build-video:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg & fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core libraqm0
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Format decide karo
        id: fmt
        run: |
          F="${{ inputs.format }}"
          VIS="${{ inputs.privacy }}"
          SLOT=""
          if [ -z "$F" ]; then
            F=short; VIS=public
            case "${{ github.event.schedule }}" in
              "0 3 * * *") SLOT="08:30" ;;
              "30 10 * * *") SLOT="16:00" ;;
              "30 15 * * *") SLOT="21:00" ;;
            esac
          elif [ "$VIS" = "now" ]; then
            VIS=public; SLOT=""
          elif [ "$VIS" = "public" ]; then
            H=$(TZ=Asia/Kolkata date +%H%M)
            if [ "$H" -lt 0810 ]; then SLOT="08:30"
            elif [ "$H" -lt 1540 ]; then SLOT="16:00"
            elif [ "$H" -lt 2040 ]; then SLOT="21:00"
            else SLOT="08:30"; fi
          fi
          echo "format=$F" >> "$GITHUB_OUTPUT"
          echo "visibility=$VIS" >> "$GITHUB_OUTPUT"
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
      - name: Slot pehle se bhara hai kya
        id: guard
        run: |
          if [ -n "${{ steps.fmt.outputs.slot }}" ]; then
            python slot_guard.py "${{ steps.fmt.outputs.slot }}" >> "$GITHUB_OUTPUT"
          else
            echo "taken=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Agent preflight
        run: python -m py_compile auto_agent.py self_repair.py
      - name: Run Pipeline (+ publish if READY)
        if: steps.guard.outputs.taken != 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          KIMI_BASE_URL: ${{ secrets.KIMI_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SELF_HEAL_MODEL: deepseek-flash
          SELF_HEAL_FALLBACK_MODEL: claude-haiku-4-5-20251001
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YT_FIN_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YT_FIN_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YT_FIN_REFRESH_TOKEN }}
          EXPECTED_CHANNEL_ID: ${{ vars.YT_FIN_CHANNEL_ID }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
          PUBLISH_VISIBILITY: ${{ steps.fmt.outputs.visibility }}
          TOPIC_KEY: ${{ inputs.topic_key }}
          PUBLISH_SLOT_IST: ${{ steps.fmt.outputs.slot }}
          IG_CROSSPOST: ${{ steps.fmt.outputs.format == 'short' && '1' || '0' }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_SURFACE: ${{ vars.IG_SURFACE || 'facebook' }}
          MEDIA_REPO: ${{ vars.MEDIA_REPO || 'bazarblast140-bot/HEYGEN--INSTAGRAM-' }}
          MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: python auto_agent.py --format ${{ steps.fmt.outputs.format }} --publish
      - name: Commit topic_bank (prevent topic repeats)
        if: success() && steps.guard.outputs.taken != 'true'
        run: |
          if git diff --quiet topic_bank.json data/published.json; then
            echo "No topic_bank / ledger changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add topic_bank.json data/published.json
            git commit -m "chore: topic + ledger update [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi
      - name: Upload video + report as artifact
        if: ${{ always() && steps.guard.outputs.taken != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.fmt.outputs.format }}-${{ github.run_number }}
          path: |
            run/final.mp4
            run/thumbnail.jpg
            run/report.md
            run/script.txt
            run/spoken.txt
            run/tts_text.txt
            run/gate1_report.txt
            run/gate2_report.txt
            run/gate3_report.txt
            run/ig_reel.txt
          retention-days: 14
