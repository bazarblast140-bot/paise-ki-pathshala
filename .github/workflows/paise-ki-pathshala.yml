name: Paise Ki Pathshala

on:
  schedule:
    - cron: "47 1 * * *"
    - cron: "23 2 * * *"
    - cron: "13 3 * * *"
    - cron: "7 13 * * *"
    - cron: "47 13 * * *"
    - cron: "23 14 * * *"
    - cron: "37 20 * * *"
    - cron: "13 21 * * *"
    - cron: "47 21 * * *"
  workflow_call:
    inputs:
      format:
        type: string
        default: short
      privacy:
        type: string
        default: public
      topic_key:
        type: string
        default: ""
      beats:
        type: string
        default: "four"
      approved:
        type: boolean
        default: false
      narration_from_run:
        type: string
        default: ""
      render_only:
        type: boolean
        default: false
      data_short:
        description: "16:00 IST Aaj ka Nifty data Short"
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      format:
        type: choice
        options: [short, long]
        default: short
      privacy:
        type: choice
        options: [unlisted, public, now]
        default: unlisted
      topic_key:
        required: false
        default: ""
      beats:
        type: choice
        options: [four, six]
        default: four
      approved:
        type: choice
        options: ["false", "true"]
        default: "false"
      narration_from_run:
        type: string
        default: ""
      render_only:
        type: choice
        options: ["false", "true"]
        default: "false"
      data_short:
        description: "16:00 IST Aaj ka Nifty data Short"
        type: boolean
        default: false
concurrency:
  group: paise-ki-pathshala-publish
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
  actions: read
jobs:
  build-video:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg & fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core libraqm0
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Re-read ledger after checkout
        run: |
          branch="${GITHUB_REF_NAME:-main}"
          git fetch origin "$branch"
          git checkout "origin/$branch" -- data/published.json
      - name: Format decide karo
        id: fmt
        run: |
          F="${{ inputs.format }}"
          VIS="${{ inputs.privacy }}"
          if [ -z "$F" ]; then
            F=short
            VIS=public
          fi
          IMMEDIATE=0
          if [ "$VIS" = "now" ]; then
            VIS=public
            IMMEDIATE=1
          fi
          echo "format=$F" >> "$GITHUB_OUTPUT"
          echo "visibility=$VIS" >> "$GITHUB_OUTPUT"
          RO="${{ inputs.render_only }}"
          case "$RO" in
            true|True|TRUE|1) RO=true ;;
            *) RO=false ;;
          esac
          echo "render_only=$RO" >> "$GITHUB_OUTPUT"
          if [ "$IMMEDIATE" = "1" ]; then
            echo "slot=" >> "$GITHUB_OUTPUT"
            echo "date_ist=" >> "$GITHUB_OUTPUT"
            echo "publish_at=" >> "$GITHUB_OUTPUT"
            echo "taken=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.data_short }}" = "true" ]; then
            python nifty_day.py --slot-env >> "$GITHUB_OUTPUT"
          elif [ "$VIS" = "public" ]; then
            SKIP_DATA_SLOT=1 python slot_guard.py --next >> "$GITHUB_OUTPUT"
          else
            echo "slot=" >> "$GITHUB_OUTPUT"
            echo "date_ist=" >> "$GITHUB_OUTPUT"
            echo "publish_at=" >> "$GITHUB_OUTPUT"
            echo "taken=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Slot pehle se bhara hai kya
        id: guard
        run: |
          echo "taken=${{ steps.fmt.outputs.taken }}" >> "$GITHUB_OUTPUT"
          echo "slot=${{ steps.fmt.outputs.slot }} date=${{ steps.fmt.outputs.date_ist }} publish_at=${{ steps.fmt.outputs.publish_at }} taken=${{ steps.fmt.outputs.taken }}"
      - name: Preflight (compile + unit tests, no network)
        continue-on-error: true
        run: |
          python -m py_compile *.py
          SUPPRESS_GHA_COMMANDS=1 PYTHONPATH=. python -m unittest discover -s tests || true
      - name: DeepSeek balance (log only, no upload)
        if: steps.guard.outputs.taken != 'true'
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
        run: python health_check.py --deepseek-balance
      - name: YouTube token health check (no upload)
        id: yt_token
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YT_FIN_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YT_FIN_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YT_FIN_REFRESH_TOKEN }}
        run: python yt_credentials.py
      - name: Competitor + own-channel research (optional, read-only)
        if: steps.guard.outputs.taken != 'true'
        continue-on-error: true
        timeout-minutes: 5
        env:
          YT_DATA_API_KEY: ${{ secrets.YT_DATA_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YT_FIN_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YT_FIN_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YT_FIN_REFRESH_TOKEN }}
          EXPECTED_CHANNEL_ID: ${{ vars.YT_FIN_CHANNEL_ID }}
        run: python competitor_research.py --max-age-hours 20
      - name: Download approved dry-run script
        if: steps.guard.outputs.taken != 'true' && inputs.narration_from_run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python approved_script.py --download "${{ inputs.narration_from_run }}" --dest run/approved_script
      - name: Lock the committed approved beats
        if: steps.guard.outputs.taken != 'true' && inputs.narration_from_run && inputs.topic_key
        env:
          APPROVED_SCRIPT_DIR: run/approved_script
          TOPIC_KEY: ${{ inputs.topic_key }}
        run: python -c "import os, approved_script; approved_script.install_repo_beats(os.environ['APPROVED_SCRIPT_DIR'], os.environ['TOPIC_KEY'])"
      - name: Run Pipeline (+ publish if READY)
        id: pipeline
        continue-on-error: true
        if: steps.guard.outputs.taken != 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          KIMI_BASE_URL: ${{ secrets.KIMI_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SELF_REPAIR: ${{ vars.SELF_REPAIR || '0' }}
          SELF_HEAL_MODEL: deepseek-flash
          SELF_HEAL_FALLBACK_MODEL: claude-haiku-4-5-20251001
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YT_FIN_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YT_FIN_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YT_FIN_REFRESH_TOKEN }}
          EXPECTED_CHANNEL_ID: ${{ vars.YT_FIN_CHANNEL_ID }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PAID_TTS_ENABLED: ${{ vars.PAID_TTS_ENABLED }}
          ELEVENLABS_VOICE_ID: ${{ inputs.narration_from_run && 'ypnkIsDASPgHZuanrF0q' || secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PUBLISH_VISIBILITY: ${{ steps.fmt.outputs.visibility }}
          TOPIC_KEY: ${{ inputs.data_short && 'aaj_ka_nifty' || inputs.topic_key }}
          DATA_SHORT: ${{ inputs.data_short && '1' || '0' }}
          SKIP_DATA_SLOT: ${{ inputs.data_short && '0' || '1' }}
          LIVE_BEATS: ${{ inputs.beats }}
          PUBLISH_SLOT_IST: ${{ steps.fmt.outputs.slot }}
          PUBLISH_DATE_IST: ${{ steps.fmt.outputs.date_ist }}
          PUBLISH_AT_UTC: ${{ steps.fmt.outputs.publish_at }}
          AUTOMATIC_UPLOAD: ${{ github.event_name == 'workflow_dispatch' && '0' || '1' }}
          REQUIRE_QA_APPROVAL: ${{ vars.REQUIRE_QA_APPROVAL || 'true' }}
          EXPLICIT_PRIVACY: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          IG_CROSSPOST: ${{ steps.fmt.outputs.format == 'short' && steps.fmt.outputs.visibility == 'public' && steps.fmt.outputs.render_only != 'true' && '1' || '0' }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_SURFACE: ${{ vars.IG_SURFACE || 'facebook' }}
          MEDIA_REPO: ${{ vars.MEDIA_REPO || 'bazarblast140-bot/HEYGEN--INSTAGRAM-' }}
          MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          ACTIONS_TOKEN_FOR_COMPARE: ${{ secrets.GITHUB_TOKEN }}
          APPROVED: ${{ github.event_name == 'schedule' && vars.AUTO_APPROVE_REVIEW || inputs.approved }}
          NARRATION_FROM_RUN: ${{ inputs.narration_from_run }}
          APPROVED_SCRIPT_DIR: run/approved_script
        run: |
          if [ "${{ steps.fmt.outputs.render_only }}" = "true" ]; then
            python auto_agent.py --format ${{ steps.fmt.outputs.format }}
          else
            python auto_agent.py --format ${{ steps.fmt.outputs.format }} --publish
          fi
      - name: Show why the build failed (annotation, secrets stay masked)
        if: always() && steps.guard.outputs.taken != 'true'
        continue-on-error: true
        run: |
          f=run/auto_agent_last.log
          if [ -s "$f" ]; then
            echo "::notice title=build log tail::$(tail -n 22 "$f" | tr -cd '[:print:]\n' | tr '\n' '~' | cut -c1-1900)"
          else
            echo "::notice title=build log tail::no run/auto_agent_last.log (the build stopped before it wrote one)"
          fi
      - name: Buffer fill if this slot is still empty
        id: buffer
        if: always() && steps.guard.outputs.taken != 'true' && steps.fmt.outputs.render_only != 'true' && inputs.data_short != true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YT_FIN_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YT_FIN_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YT_FIN_REFRESH_TOKEN }}
          EXPECTED_CHANNEL_ID: ${{ vars.YT_FIN_CHANNEL_ID }}
          PUBLISH_VISIBILITY: ${{ steps.fmt.outputs.visibility }}
          PUBLISH_SLOT_IST: ${{ steps.fmt.outputs.slot }}
          PUBLISH_DATE_IST: ${{ steps.fmt.outputs.date_ist }}
          PUBLISH_AT_UTC: ${{ steps.fmt.outputs.publish_at }}
          AUTOMATIC_UPLOAD: ${{ github.event_name == 'workflow_dispatch' && '0' || '1' }}
          REQUIRE_QA_APPROVAL: ${{ vars.REQUIRE_QA_APPROVAL || 'true' }}
          EXPLICIT_PRIVACY: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          IG_CROSSPOST: ${{ steps.fmt.outputs.format == 'short' && steps.fmt.outputs.visibility == 'public' && '1' || '0' }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_SURFACE: ${{ vars.IG_SURFACE || 'facebook' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          APPROVED: ${{ github.event_name == 'schedule' && vars.AUTO_APPROVE_REVIEW || inputs.approved }}
        run: python buffer_shorts.py --fill-scheduled
      - name: YouTube upload recorded
        id: uploaded
        if: ${{ !cancelled() && steps.guard.outputs.taken != 'true' }}
        run: |
          id=""
          if [ -s run/uploaded.txt ]; then
            id="$(tr -d '\r' < run/uploaded.txt | head -n 1 | awk '{print $1}')"
          fi
          if [ -n "$id" ]; then
            echo "youtube_uploaded=true" >> "$GITHUB_OUTPUT"
            echo "video_id=$id" >> "$GITHUB_OUTPUT"
          else
            echo "youtube_uploaded=false" >> "$GITHUB_OUTPUT"
            echo "video_id=" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit topic_bank (prevent topic repeats)
        if: ${{ !cancelled() && steps.guard.outputs.taken != 'true' && (steps.uploaded.outputs.youtube_uploaded == 'true' || success() || steps.buffer.outcome == 'success' || steps.pipeline.outcome == 'failure') }}
        run: |
          FILES=""
          for f in topic_bank.json data/published.json data/buffer_manifest.json data/gate_skips.json data/competitor_insights.json \
                   data/competitor_performance.json data/own_topic_performance.json; do
            [ -e "$f" ] && FILES="$FILES $f"
          done
          git add -N $FILES
          if git diff --quiet -- $FILES; then
            echo "No topic_bank / ledger / research changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add $FILES
            git commit -m "chore: topic + ledger update [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi
      - name: Upload video + report as artifact
        if: ${{ always() && steps.guard.outputs.taken != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.fmt.outputs.format }}-${{ github.run_number }}
          path: |
            run/final.mp4
            run/thumbnail.jpg
            run/sc_*.png
            run/report.md
            run/verify_meta.json
            run/self_review.json
            run/script.txt
            run/spoken.txt
            run/tts_text.txt
            run/gate1_report.txt
            run/gate2_report.txt
            run/gate3_report.txt
            run/ig_reel.txt
            run/ig_status.txt
            run/ig_cover.jpg
            run/uploaded.txt
            run/youtube_status.txt
            run/auto_agent_last.log
            run/credits.json
            run/narration_block.json
            run/voice.wav
          retention-days: 14
      - name: QA artifact path
        if: always()
        run: |
          {
            echo "artifact: ${{ steps.fmt.outputs.format }}-${{ github.run_number }}"
            echo "final.mp4: run/final.mp4"
          } >> "$GITHUB_STEP_SUMMARY"
