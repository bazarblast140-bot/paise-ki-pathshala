name: Paise Ki Pathshala

# Hindi personal-finance channel. Secrets: DEEPSEEK_API_KEY, PEXELS_API_KEY,
# TELEGRAM_*, YT_FIN_* (python youtube_auth.py --set-github-secret),
# ELEVENLABS_*, IG_ACCESS_TOKEN, optional YT_DATA_API_KEY (competitor research).
# Variables: YT_FIN_CHANNEL_ID, IG_USER_ID, optional SELF_REPAIR.
on:
  # Build AHEAD of the slot. YouTube publishAt is the public time.
  # Odd minutes only — GitHub sheds :00 and :30. Three triggers per slot
  # (~3–4h before, ~2–3h before, backup). Still 3 public slots a day.
  # 08:30 IST = 03:00 UTC. 16:00 IST = 10:30 UTC. 21:00 IST = 15:30 UTC.
  schedule:
    - cron: "47 23 * * *"   # 05:17 IST -> 08:30
    - cron: "17 0 * * *"    # 05:47 IST -> 08:30
    - cron: "23 1 * * *"    # 06:53 IST -> 08:30 backup
    - cron: "41 6 * * *"    # 12:11 IST -> 16:00
    - cron: "47 7 * * *"    # 13:17 IST -> 16:00
    - cron: "53 8 * * *"    # 14:23 IST -> 16:00 backup
    - cron: "47 11 * * *"   # 17:17 IST -> 21:00
    - cron: "13 13 * * *"   # 18:43 IST -> 21:00
    - cron: "7 14 * * *"    # 19:37 IST -> 21:00 backup
  # NOTE: no `push:` trigger on purpose. A push that touched this file used to
  # start a PUBLIC upload with no slot and no slot guard (inputs are empty on
  # push, so the format step falls back to short + public). Between 30-Sep and
  # 01-Oct-2026 every "chore: trigger ..." comment commit published a Short and
  # a Reel this way. To test, use Run workflow (privacy = unlisted).
  workflow_call:
    inputs:
      format:
        type: string
        default: short
      privacy:
        type: string
        default: public
      topic_key:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      format:
        description: "long (16:9, ~5 min) ya short (9:16, ~50s)"
        type: choice
        options: [short, long]
        default: short
      privacy:
        description: "unlisted = test; public = agle slot par; now = abhi turant public"
        type: choice
        options: [unlisted, public, now]
        default: unlisted
      topic_key:
        description: "TEST: sirf ye topic (jaise titan_2010); rotation me used mark nahi hota"
        required: false
        default: ""
concurrency:
  # One group for every early trigger. The backup waits; it does not cancel
  # the run already building the slot. slot_guard then sees the ledger and skips.
  group: paise-ki-pathshala-publish
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build-video:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg & fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core libraqm0
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Format decide karo
        id: fmt
        run: |
          F="${{ inputs.format }}"
          VIS="${{ inputs.privacy }}"
          if [ -z "$F" ]; then
            F=short
            VIS=public
          fi
          IMMEDIATE=0
          if [ "$VIS" = "now" ]; then
            VIS=public
            IMMEDIATE=1
          fi
          echo "format=$F" >> "$GITHUB_OUTPUT"
          echo "visibility=$VIS" >> "$GITHUB_OUTPUT"
          if [ "$IMMEDIATE" = "1" ]; then
            echo "slot=" >> "$GITHUB_OUTPUT"
            echo "date_ist=" >> "$GITHUB_OUTPUT"
            echo "publish_at=" >> "$GITHUB_OUTPUT"
            echo "taken=false" >> "$GITHUB_OUTPUT"
          elif [ "$VIS" = "public" ]; then
            # Next unfilled slot still far enough ahead. Skip if the ledger has it.
            python slot_guard.py --next >> "$GITHUB_OUTPUT"
          else
            echo "slot=" >> "$GITHUB_OUTPUT"
            echo "date_ist=" >> "$GITHUB_OUTPUT"
            echo "publish_at=" >> "$GITHUB_OUTPUT"
            echo "taken=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Slot pehle se bhara hai kya
        id: guard
        run: |
          echo "taken=${{ steps.fmt.outputs.taken }}" >> "$GITHUB_OUTPUT"
          echo "slot=${{ steps.fmt.outputs.slot }} date=${{ steps.fmt.outputs.date_ist }} publish_at=${{ steps.fmt.outputs.publish_at }} taken=${{ steps.fmt.outputs.taken }}"
      - name: Preflight (compile + unit tests, no network)
        run: |
          python -m py_compile *.py
          # Simulated failures must not emit ::error. That annotation was
          # showing a Testing-app token expiry on jobs whose token check passed.
          SUPPRESS_GHA_COMMANDS=1 PYTHONPATH=. python -m unittest discover -s tests
      - name: DeepSeek balance (log only, no upload)
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
        run: python health_check.py --deepseek-balance
      - name: YouTube token health check (no upload)
        id: yt_token
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YT_FIN_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YT_FIN_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YT_FIN_REFRESH_TOKEN }}
        run: python yt_credentials.py
      - name: Competitor + own-channel research (optional, read-only)
        if: steps.guard.outputs.taken != 'true'
        continue-on-error: true
        timeout-minutes: 5
        env:
          YT_DATA_API_KEY: ${{ secrets.YT_DATA_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YT_FIN_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YT_FIN_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YT_FIN_REFRESH_TOKEN }}
          EXPECTED_CHANNEL_ID: ${{ vars.YT_FIN_CHANNEL_ID }}
        run: python competitor_research.py --max-age-hours 20
      - name: Run Pipeline (+ publish if READY)
        if: steps.guard.outputs.taken != 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          KIMI_BASE_URL: ${{ secrets.KIMI_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # LLM/deterministic code self-repair inside CI (patches + pushes to main)
          # is OFF unless repo variable SELF_REPAIR is set to 1. See auto_agent.py.
          SELF_REPAIR: ${{ vars.SELF_REPAIR || '0' }}
          SELF_HEAL_MODEL: deepseek-flash
          SELF_HEAL_FALLBACK_MODEL: claude-haiku-4-5-20251001
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YT_FIN_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YT_FIN_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YT_FIN_REFRESH_TOKEN }}
          EXPECTED_CHANNEL_ID: ${{ vars.YT_FIN_CHANNEL_ID }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
          PUBLISH_VISIBILITY: ${{ steps.fmt.outputs.visibility }}
          TOPIC_KEY: ${{ inputs.topic_key }}
          PUBLISH_SLOT_IST: ${{ steps.fmt.outputs.slot }}
          PUBLISH_DATE_IST: ${{ steps.fmt.outputs.date_ist }}
          PUBLISH_AT_UTC: ${{ steps.fmt.outputs.publish_at }}
          # Reel only for PUBLIC runs: an unlisted test must not post a public Reel.
          IG_CROSSPOST: ${{ steps.fmt.outputs.format == 'short' && steps.fmt.outputs.visibility == 'public' && '1' || '0' }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_SURFACE: ${{ vars.IG_SURFACE || 'facebook' }}
          MEDIA_REPO: ${{ vars.MEDIA_REPO || 'bazarblast140-bot/HEYGEN--INSTAGRAM-' }}
          MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          # Compared to MEDIA_REPO_TOKEN so a GITHUB_TOKEN fallback is logged
          # by name. The value is never printed.
          ACTIONS_TOKEN_FOR_COMPARE: ${{ secrets.GITHUB_TOKEN }}
        run: python auto_agent.py --format ${{ steps.fmt.outputs.format }} --publish
      - name: Commit topic_bank (prevent topic repeats)
        if: success() && steps.guard.outputs.taken != 'true'
        run: |
          FILES=""
          for f in topic_bank.json data/published.json data/competitor_insights.json \
                   data/competitor_performance.json data/own_topic_performance.json; do
            [ -e "$f" ] && FILES="$FILES $f"
          done
          git add -N $FILES
          if git diff --quiet -- $FILES; then
            echo "No topic_bank / ledger / research changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add $FILES
            git commit -m "chore: topic + ledger update [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi
      - name: Upload video + report as artifact
        if: ${{ always() && steps.guard.outputs.taken != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.fmt.outputs.format }}-${{ github.run_number }}
          path: |
            run/final.mp4
            run/thumbnail.jpg
            run/report.md
            run/verify_meta.json
            run/self_review.json
            run/script.txt
            run/spoken.txt
            run/tts_text.txt
            run/gate1_report.txt
            run/gate2_report.txt
            run/gate3_report.txt
            run/ig_reel.txt
            run/ig_cover.jpg
            run/youtube_status.txt
            run/auto_agent_last.log
          retention-days: 14
