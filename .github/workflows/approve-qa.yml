name: Approve QA

# A video uploaded under the QA hold is private with no publishAt.
# This sets publishAt, or makes it public now, and leaves the Reel deferred
# so the Instagram Reel Publish Watchdog posts once the video is public.
on:
  workflow_dispatch:
    inputs:
      youtube_video_id:
        description: "YouTube video id from the pending QA ledger row"
        required: true
        type: string
      slot:
        description: "HH:MM IST, or now to make the video public immediately"
        required: true
        type: string
      date_ist:
        description: "IST date YYYY-MM-DD. Required unless slot is now."
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  approve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Set publishAt or make public, and defer the Reel
        env:
          YOUTUBE_VIDEO_ID: ${{ inputs.youtube_video_id }}
          QA_SLOT: ${{ inputs.slot }}
          QA_DATE_IST: ${{ inputs.date_ist }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YT_FIN_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YT_FIN_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YT_FIN_REFRESH_TOKEN }}
          EXPECTED_CHANNEL_ID: ${{ vars.YT_FIN_CHANNEL_ID }}
        run: python approve_qa.py
      - name: Commit the approved ledger row
        if: ${{ !cancelled() }}
        run: |
          git add -N data/published.json
          if git diff --quiet -- data/published.json; then
            echo "Ledger unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/published.json
            git commit -m "chore: approve QA [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi
