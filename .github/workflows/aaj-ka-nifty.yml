name: Aaj ka Nifty

# The weekday 16:00 data Short is replaced by the close Reel in daily-reels.yml.
# This file stays as a manual dispatch only. It has no schedule.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  build:
    uses: ./.github/workflows/paise-ki-pathshala.yml
    with:
      format: short
      privacy: public
      data_short: true
      topic_key: aaj_ka_nifty
      beats: four
    secrets: inherit
