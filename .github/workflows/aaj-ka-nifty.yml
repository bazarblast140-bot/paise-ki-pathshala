name: Aaj ka Nifty

# One data Short a day, aimed at the 16:00 IST slot. Cash close is 15:30 IST,
# so the build starts at 15:51 IST on weekdays. Weekends are not scheduled.
# NSE holidays skip inside nifty_day.py with a ledger row and no video.
# Slot watch (16:49 IST) is the fallback when this cron does not fire.
on:
  schedule:
    - cron: "21 10 * * 1-5"   # 15:51 IST, Mon-Fri
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  build:
    uses: ./.github/workflows/paise-ki-pathshala.yml
    with:
      format: short
      privacy: public
      data_short: true
      topic_key: aaj_ka_nifty
      beats: four
    secrets: inherit
