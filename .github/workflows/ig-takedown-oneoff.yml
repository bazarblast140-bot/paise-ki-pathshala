name: IG takedown one-off 2026-10-15
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - env: {T: "${{ secrets.IG_ACCESS_TOKEN }}"}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.parse,urllib.error
          T=os.environ["T"]
          def call(m,host,path,params={}):
              q=urllib.parse.urlencode(dict(params,access_token=T))
              try:
                  r=urllib.request.urlopen(urllib.request.Request(f"https://{host}/v21.0/{path}?{q}",method=m)); return r.status,r.read().decode()[:600]
              except urllib.error.HTTPError as e: return e.code,e.read().decode()[:600]
              except Exception as e: return 0,str(e)
          print("IGBA",call("GET","graph.facebook.com","me",{"fields":"instagram_business_account{id,username,media.limit(5){id,media_product_type,timestamp,permalink}}"}))
          print("PAGEVIDEOS",call("GET","graph.facebook.com","me/videos",{"fields":"id,title,description,created_time,permalink_url","limit":"5"}))
          print("PAGEREELS",call("GET","graph.facebook.com","me/video_reels",{"fields":"id,description,created_time","limit":"5"}))
          print("PAGEPOSTS",call("GET","graph.facebook.com","me/posts",{"fields":"id,message,created_time,permalink_url","limit":"5"}))
          PY
