name: Fix topic bank once
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore good bank and strip Yes Bank spam
        run: |
          git show ee04f4c6adb4b7dc45a486fd5e748d37253492f9:topic_bank.json > topic_bank.json
          python3 -c "
          import pathlib
          p = pathlib.Path('topic_bank.json')
          t = p.read_text(encoding='utf-8')
          old = 'हर शेयर ऐसा नहीं करता — Yes Bank 2015 से करीब 85% नीचे'
          new = 'हर शेयर ऐसा नहीं करता — कुछ शेयर 80-90% गिर भी सकते हैं'
          print('replacements', t.count(old))
          p.write_text(t.replace(old, new), encoding='utf-8')
          "
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add topic_bank.json
          git commit -m "fix(topics): restore bank + Yes Bank spam → generic warning" || echo no change
          git push
