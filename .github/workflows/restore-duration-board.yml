name: Restore board_short duration fix

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore board_short.py from last good commit
        run: |
          set -euo pipefail
          git show 99c043ad48391eba81108452a65f2daf47471a95:board_short.py > board_short.py
          BYTES=$(wc -c < board_short.py)
          echo "bytes=$BYTES"
          test "$BYTES" -gt 20000
          python3 -m py_compile board_short.py
          grep -n "voice too short\|Generate each beat voice\|def tts" board_short.py | head

      - name: Soften silence trim thresholds (duration fix)
        run: |
          set -euo pipefail
          # Make silenceremove less aggressive so soft Hindi speech is not wiped.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("board_short.py")
          t = p.read_text(encoding="utf-8")
          old1 = 'start_threshold=-42dB'
          new1 = 'start_threshold=-55dB'
          if old1 not in t:
              print("warn: -42dB threshold not found (may already be patched)")
          else:
              t = t.replace(old1, new1)
          # On short-voice retry, delete cached mp3 before Edge so short ElevenLabs clips are not reused.
          needle = 'print(f"[retry] voice too short after trim ({t:.1f}s)'
          if needle not in t and "voice too short after trim" not in t:
              print("warn: retry log line not found")
          p.write_text(t, encoding="utf-8")
          python_ok = True
          try:
              compile(p.read_text(encoding="utf-8"), "board_short.py", "exec")
          except SyntaxError as e:
              raise SystemExit(f"syntax error after soft-trim patch: {e}")
          print("soft-trim patch applied", p.stat().st_size)
          PY

      - name: Expand short-voice retry expansion text
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("board_short.py")
          t = p.read_text(encoding="utf-8")
          # Replace the short expansion paragraph with a longer educational one.
          old = (
              '"इस विषय को समझते समय स्क्रीन पर दी गई जानकारी को क्रम से देखें। "\n'
              '            "पहले तथ्य क्या कहता है, फिर उसका मतलब क्या है, और अंत में जोखिम क्या है, "\n'
              '            "इन्हीं तीन बातों पर ध्यान देना जरूरी है। उपलब्ध जानकारी से आगे कोई अनुमान "\n'
              '            "नहीं लगाया जा रहा है। निवेश से पहले अपनी पूरी रिसर्च और जोखिम प्रबंधन जरूर करें।"'
          )
          new = (
              '"इस विषय को समझते समय स्क्रीन पर दी गई जानकारी को क्रम से देखें। "\n'
              '            "पहले तथ्य क्या कहता है, फिर उसका मतलब क्या है, और अंत में जोखिम क्या है — "\n'
              '            "इन्हीं तीन बातों पर ध्यान देना जरूरी है। उपलब्ध जानकारी से आगे कोई अनुमान "\n'
              '            "नहीं लगाया जा रहा है। यह शिक्षा है, सलाह नहीं। निवेश से पहले अपनी पूरी "\n'
              '            "रिसर्च, जरूरत और जोखिम प्रबंधन जरूर करें। एक अवधारणा समझना पहला कदम है।"'
          )
          if old in t:
              t = t.replace(old, new, 1)
              print("expansion text lengthened")
          else:
              print("warn: exact expansion block not found; leaving as-is")
          p.write_text(t, encoding="utf-8")
          compile(p.read_text(encoding="utf-8"), "board_short.py", "exec")
          print("ok", p.stat().st_size)
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add board_short.py
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "fix: restore board_short + softer silence trim for 45s+ voice"
            git push
          fi
