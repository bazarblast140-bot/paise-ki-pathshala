name: Restore board_short duration fix
on:
  workflow_dispatch:
  push:
    paths:
      - 'board_short_chunks/**'
      - 'restore_board_short_from_chunks.py'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble board_short.py
        run: python3 restore_board_short_from_chunks.py
      - name: Syntax check
        run: python3 -m py_compile board_short.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add board_short.py
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "fix: restore duration-safe TTS board_short from chunks"
            git push
          fi
