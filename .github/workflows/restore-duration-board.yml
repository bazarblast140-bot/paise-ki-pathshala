name: Restore board_short duration fix

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply TTS retry patch
        run: python3 tools/patch_tts_retry.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add board_short.py
          if git diff --cached --quiet; then
            echo nochange
          else
            git commit -m "fix: Edge retry gentle trim + expand (stop 36s->8s collapse)"
            git push
          fi
