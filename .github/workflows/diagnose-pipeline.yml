name: Diagnose pipeline (temporary)

# Read-only. Runs the same setup checks and one preview build WITHOUT any
# upload, and copies the last lines of each step into annotations so the
# failure reason can be read through the API. Secrets stay masked.
on:
  workflow_dispatch:
  push:
    branches: ["diag/**"]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YT_FIN_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YT_FIN_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YT_FIN_REFRESH_TOKEN }}
      EXPECTED_CHANNEL_ID: ${{ vars.YT_FIN_CHANNEL_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      SUPPRESS_GHA_COMMANDS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg & fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core libraqm0
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Which secrets exist (names only, never values)
        run: |
          for v in DEEPSEEK_API_KEY DEEPSEEK_BASE_URL KIMI_API_KEY ANTHROPIC_API_KEY PEXELS_API_KEY \
                   YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN EXPECTED_CHANNEL_ID; do
            if [ -n "${!v}" ]; then s=set; else s=EMPTY; fi
            printf '%s=%s; ' "$v" "$s"
          done > out_secrets.txt
          echo "::notice title=secrets::$(cat out_secrets.txt)"
      - name: Preflight setup check
        continue-on-error: true
        run: |
          python check_setup.py > out_setup.txt 2>&1; rc=$?
          echo "::notice title=check_setup rc=$rc::$(tail -n 25 out_setup.txt | tr '\n' '|')"
      - name: DeepSeek balance
        continue-on-error: true
        run: |
          python health_check.py --deepseek-balance > out_ds.txt 2>&1; rc=$?
          echo "::notice title=deepseek rc=$rc::$(tail -n 15 out_ds.txt | tr '\n' '|')"
      - name: YouTube token
        continue-on-error: true
        run: |
          python yt_credentials.py > out_yt.txt 2>&1; rc=$?
          echo "::notice title=youtube rc=$rc::$(tail -n 15 out_yt.txt | tr '\n' '|')"
      - name: Preview build (no upload)
        continue-on-error: true
        env:
          PIPELINE_MODE: preview
          PUBLISH_VISIBILITY: unlisted
          AUTOMATIC_UPLOAD: "0"
          EXPLICIT_PRIVACY: "1"
          BUFFER_FILL: "0"
          ELEVENLABS_OPT_IN: "0"
          DEEPSEEK_MAX_CALLS: "4"
          TOPIC_KEY: hammer
        run: |
          set +e
          python run_pipeline.py --format short > out_build.txt 2>&1; rc=$?
          clean() { tr -cd '[:print:]\n' | tr '\n' '~' | cut -c1-1900; }
          echo "::notice title=build-rc::rc=$rc lines=$(wc -l < out_build.txt)"
          echo "::notice title=build-flags::$(grep -n -E 'FAIL|STOP|BLOCK|Error|Traceback|retry|skip' out_build.txt | tail -n 14 | clean)"
          echo "::notice title=build-tail::$(tail -n 14 out_build.txt | clean)"
          echo "::notice title=build-head::$(head -n 14 out_build.txt | clean)"
      - name: Live-slot build exactly like the schedule (render only, no upload)
        continue-on-error: true
        env:
          PUBLISH_VISIBILITY: public
          AUTOMATIC_UPLOAD: "1"
          REQUIRE_QA_APPROVAL: "true"
          EXPLICIT_PRIVACY: "0"
          IG_CROSSPOST: "0"
          SELF_REPAIR: "0"
          DEEPSEEK_MAX_CALLS: "4"
        run: |
          set +e
          eval "$(python slot_guard.py --next 2>/dev/null | sed -n 's/^\(slot\|date_ist\|publish_at\)=\(.*\)$/export \1=\2/p' | sed 's/^export slot=/export PUBLISH_SLOT_IST=/; s/^export date_ist=/export PUBLISH_DATE_IST=/; s/^export publish_at=/export PUBLISH_AT_UTC=/')"
          echo "slot=$PUBLISH_SLOT_IST date=$PUBLISH_DATE_IST at=$PUBLISH_AT_UTC" > out_live.txt
          python auto_agent.py --format short >> out_live.txt 2>&1; rc=$?
          clean() { tr -cd '[:print:]\n' | tr '\n' '~' | cut -c1-1900; }
          echo "::notice title=live-rc::rc=$rc lines=$(wc -l < out_live.txt)"
          echo "::notice title=live-flags::$(grep -n -E 'FAIL|STOP|BLOCK|Error|Traceback|retry|skip|taken|guard|hold|OK' out_live.txt | tail -n 16 | clean)"
          echo "::notice title=live-tail::$(tail -n 16 out_live.txt | clean)"
          echo "::notice title=live-head::$(head -n 12 out_live.txt | clean)"
