name: Slot watch

# Har slot ke ~45 min baad dekhta hai ki us slot ka video sach me gaya ya nahi.
# Khali mile to: Telegram par khabar + turant naya Short bana ke agle slot par laga deta hai
# (fill job neeche build workflow ko hi call karta hai).
# Kyun: GitHub kabhi cron drop kar deta hai aur DeepSeek kabhi fail hota hai — 14 aur
# 15 Sep ko ek-ek slot aise hi khali chala gaya tha.
on:
  schedule:
    - cron: "15 3 * * *"     # 08:45 IST -> 08:30 slot
    - cron: "45 10 * * *"    # 16:15 IST -> 16:00 slot
    - cron: "45 15 * * *"    # 21:15 IST -> 21:00 slot
  workflow_dispatch:
    inputs:
      slot:
        description: "Kaunsa slot check karein (khali = abhi-abhi guzra slot)"
        type: choice
        options: ["", "08:30", "16:00", "21:00"]
        default: ""
      fill:
        description: "Khali mile to naya video bhi bana do"
        type: boolean
        default: true

# build workflow topic_bank + ledger commit karta hai
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      missing: ${{ steps.check.outputs.missing }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Slot check
        id: check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLOT_CHECK: ${{ inputs.slot }}
        run: |
          if [ -z "$SLOT_CHECK" ]; then
            case "${{ github.event.schedule }}" in
              "15 3 * * *")  SLOT_CHECK="08:30" ;;
              "45 10 * * *") SLOT_CHECK="16:00" ;;
              "45 15 * * *") SLOT_CHECK="21:00" ;;
            esac
          fi
          SLOT_CHECK="$SLOT_CHECK" python slot_watch.py

  # Khali slot: naya Short bana ke TURANT public (privacy=now). Agle slot par lagane
  # se fayda nahi hota — wo slot to apne cron se waise bhi banta; is din ka teesra
  # video tabhi milega jab ye abhi chala jaye (slot se ~45 min late, par gaya to sahi).
  fill:
    needs: check
    if: needs.check.outputs.missing == 'true' && inputs.fill != false
    uses: ./.github/workflows/paise-ki-pathshala.yml
    with:
      format: short
      privacy: now
    secrets: inherit
