name: Slot watch

# Har slot ke baad dekhta hai ki us slot ka video sach me gaya ya nahi.
# Khali mile to: Telegram. Fill tabhi jab agla khali slot 26h lookahead me ho —
# wahi ahead-of-slot publishAt, koi extra turant-public video nahi.
# Missed slot doosre slot par roll nahi hota.
# Odd minutes, 22:30–01:30 UTC ke bahar: GitHub :00/:30 aur midnight crush gira deta hai.
on:
  schedule:
    - cron: "19 3 * * *"     # 08:49 IST -> 08:30 slot (03:19 UTC, outside the midnight crush)
    - cron: "51 10 * * 1-5"  # 16:21 IST -> 16:00 slot, weekdays, if the 15:51 Nifty cron dropped
    - cron: "19 11 * * *"    # 16:49 IST -> 16:00 slot
    - cron: "19 16 * * *"    # 21:49 IST -> 21:00 slot
  workflow_dispatch:
    inputs:
      slot:
        description: "Kaunsa slot check karein (auto = abhi-abhi guzra slot)"
        type: choice
        options: ["auto", "08:30", "16:00", "21:00"]
        default: "auto"
      fill:
        description: "Khali mile to naya video bhi bana do"
        type: boolean
        default: true

# build workflow topic_bank + ledger commit karta hai.
# The fill job calls paise-ki-pathshala.yml, which requests actions: read.
# A caller that does not grant that permission dies at startup with 0 jobs.
permissions:
  contents: write
  issues: write
  actions: read

jobs:
  check:
    # Wait until an in-flight publish (including its ledger commit) has finished.
    # The fill job calls paise-ki-pathshala.yml, which uses this same group, so
    # the group stays on this job only — the called workflow takes it next.
    concurrency:
      group: paise-ki-pathshala-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    outputs:
      missing: ${{ steps.check.outputs.missing }}
      fill: ${{ steps.check.outputs.fill }}
      use_buffer: ${{ steps.check.outputs.use_buffer }}
      buffer_date: ${{ steps.check.outputs.buffer_date }}
      buffer_slot: ${{ steps.check.outputs.buffer_slot }}
      nifty_fill: ${{ steps.check.outputs.nifty_fill }}
      nifty_dispatch: ${{ steps.check.outputs.nifty_dispatch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Slot check
        id: check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLOT_CHECK: ${{ inputs.slot }}
        run: |
          if [ -z "$SLOT_CHECK" ]; then
            case "${{ github.event.schedule }}" in
              "19 3 * * *")  SLOT_CHECK="08:30" ;;
              "51 10 * * 1-5") SLOT_CHECK="16:00" ;;
              "19 11 * * *") SLOT_CHECK="16:00" ;;
              "19 16 * * *") SLOT_CHECK="21:00" ;;
            esac
          fi
          SLOT_CHECK="$SLOT_CHECK" python slot_watch.py

  # The slot that just passed is still empty and not on hold. A buffer
  # Short is already gated, so a late private + publishAt beats leaving it blank.
  # Same concurrency group as the publish workflow: the upload waits its turn,
  # then re-reads the ledger and the live YouTube schedule.
  buffer-fill:
    needs: check
    if: needs.check.outputs.use_buffer == 'true' && (github.event_name == 'schedule' || inputs.fill == true)
    concurrency:
      group: paise-ki-pathshala-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Re-read ledger before the buffer upload
        run: |
          branch="${GITHUB_REF_NAME:-main}"
          git fetch origin "$branch"
          git checkout "origin/$branch" -- data/published.json data/buffer_manifest.json
      - name: Fill this slot from the buffer
        env:
          BUFFER_DATE: ${{ needs.check.outputs.buffer_date }}
          BUFFER_SLOT: ${{ needs.check.outputs.buffer_slot }}
          PUBLISH_VISIBILITY: public
          AUTOMATIC_UPLOAD: "1"
          REQUIRE_QA_APPROVAL: ${{ vars.REQUIRE_QA_APPROVAL || 'true' }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YT_FIN_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YT_FIN_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YT_FIN_REFRESH_TOKEN }}
          EXPECTED_CHANNEL_ID: ${{ vars.YT_FIN_CHANNEL_ID }}
          IG_CROSSPOST: "1"
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_SURFACE: ${{ vars.IG_SURFACE || 'facebook' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          case "$BUFFER_SLOT" in
            08:30|21:00)
              PUBLISH_SLOT_IST="$BUFFER_SLOT" PUBLISH_DATE_IST="$BUFFER_DATE" \
                python approved_buffer.py --publish
              ;;
            *)
              python buffer_shorts.py --fill-last-chance
              ;;
          esac
      - name: YouTube upload recorded
        id: uploaded
        if: ${{ !cancelled() }}
        run: |
          id=""
          if [ -s run/uploaded.txt ]; then
            id="$(tr -d '\r' < run/uploaded.txt | head -n 1 | awk '{print $1}')"
          fi
          if [ -n "$id" ]; then
            echo "youtube_uploaded=true" >> "$GITHUB_OUTPUT"
            echo "video_id=$id" >> "$GITHUB_OUTPUT"
          else
            echo "youtube_uploaded=false" >> "$GITHUB_OUTPUT"
            echo "video_id=" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit ledger and buffer manifest
        # Same rule as the publish workflow: a Reel failure after the YouTube
        # id exists must still push the ledger, or the next watch fills again.
        if: ${{ !cancelled() && (steps.uploaded.outputs.youtube_uploaded == 'true' || success()) }}
        run: |
          git add data/published.json data/buffer_manifest.json
          if git diff --cached --quiet; then
            echo "No buffer ledger changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: buffer fill [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi
      - name: Upload buffer fill artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: buffer-fill-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            run/final.mp4
            run/script.txt
            run/report.md
            run/verify_meta.json
            run/self_review.json
            run/uploaded.txt
            run/ig_reel.txt
            run/ig_status.txt
            run/thumbnail.jpg
            run/voice.wav
      - name: QA artifact path
        if: always()
        run: |
          {
            echo "artifact: buffer-fill-${{ github.run_id }}"
            echo "final.mp4: run/final.mp4"
          } >> "$GITHUB_STEP_SUMMARY"

  # Khali slot ka alert alag hai. Fill sirf tab jab next unfilled slot
  # 26h lookahead me ho (aur kam se kam 2h door). privacy=public -> private + publishAt. Instant
  # public (privacy=now) yahan nahi — usse din ka extra post ban jaata tha.
  fill:
    needs: check
    if: needs.check.outputs.fill == 'true' && (github.event_name == 'schedule' || inputs.fill == true)
    uses: ./.github/workflows/paise-ki-pathshala.yml
    with:
      format: short
      privacy: public
      from_buffer: true
    secrets: inherit

  # Dropped 15:51 IST cron, before 16:20: the missed 16:00 slot is still today's Nifty bar.
  # After 16:20 the catch-up job dispatches aaj-ka-nifty.yml instead, so this
  # job stays off and the two paths cannot both publish.
  nifty-fill:
    needs: check
    if: needs.check.outputs.nifty_fill == 'true' && needs.check.outputs.nifty_dispatch != 'true' && (github.event_name == 'schedule' || inputs.fill == true)
    uses: ./.github/workflows/paise-ki-pathshala.yml
    with:
      format: short
      privacy: public
      data_short: true
      topic_key: aaj_ka_nifty
    secrets: inherit

  # 15:51 IST cron dropped. After 16:20 IST on a trading day, start Aaj ka
  # Nifty once. The check job already skipped this when today's Short is
  # uploaded or a run is in progress. No second publish concurrency group:
  # aaj-ka-nifty.yml takes the publish group itself.
  nifty-catchup:
    needs: check
    if: needs.check.outputs.nifty_dispatch == 'true' && (github.event_name == 'schedule' || inputs.fill == true)
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Aaj ka Nifty
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run aaj-ka-nifty.yml --ref "${GITHUB_REF_NAME:-main}"
