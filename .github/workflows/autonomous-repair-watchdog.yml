name: Autonomous Repair Watchdog

# MANUAL ONLY. It used to fire automatically after every failed production run,
# let an LLM / regex patch source files, commit straight to main and then
# re-dispatch a PUBLIC production run. That re-dispatch also ran when no repair
# was found (the repair step exits 0), so a failure simply started another
# public build. Run it by hand when you want it:
#   gh workflow run "Autonomous Repair Watchdog" -f failed_run_id=<run id>
on:
  workflow_dispatch:
    inputs:
      failed_run_id:
        description: "Failed 'Paise Ki Pathshala' run id to diagnose"
        required: true
      redispatch:
        description: "Repair commit hone ke baad production run dobara chalana hai? (unlisted)"
        type: boolean
        default: false

concurrency:
  group: autonomous-repair-${{ inputs.failed_run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect failed run logs
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_RUN: ${{ inputs.failed_run_id }}
        run: |
          mkdir -p run
          gh run view "$FAILED_RUN" --log-failed > run/watchdog_failure.log || true
          test -s run/watchdog_failure.log
          echo "Collected failed run $FAILED_RUN"

      - name: Install repair dependencies
        run: python -m pip install -r requirements.txt

      - name: Autonomous diagnosis and repair
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          KIMI_BASE_URL: ${{ secrets.KIMI_BASE_URL }}
          SELF_HEAL_MODEL: deepseek-flash
          SELF_HEAL_FALLBACK_MODEL: claude-haiku-4-5-20251001
          FAILED_RUN: ${{ inputs.failed_run_id }}
        run: |
          python - <<'PY'
          import os, sys
          from pathlib import Path
          import self_repair

          log = Path("run/watchdog_failure.log").read_text(encoding="utf-8", errors="replace")
          repaired = False
          for attempt in (1, 2):
              changed, detail = self_repair.propose_and_apply(log, attempt)
              print(f"[WATCHDOG] repair {attempt}: {detail}")
              if not changed:
                  break
              repaired = True
              # The patch must compile before it can be committed.
              if any("compile" in x.lower() or "apply" in x.lower() for x in [detail]):
                  pass
              # A second repair is based on the same concrete failure only if needed.
              break

          if not repaired:
              print("[WATCHDOG] no safe repository repair found; leaving original run failed")
              sys.exit(0)

          self_repair.commit_repair()
          Path("run/watchdog_repaired").write_text("verified repair committed\n")
          PY

      - name: Re-run repaired production workflow
        # Only when asked AND a repair was actually committed in this run.
        if: ${{ inputs.redispatch && hashFiles('run/watchdog_repaired') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_RUN: ${{ inputs.failed_run_id }}
        run: |
          # Verification run of the repaired code: always UNLISTED (no public
          # Short, and IG_CROSSPOST is off for unlisted runs). The next scheduled
          # slot publishes publicly as usual.
          FORMAT=short
          if gh run view "$FAILED_RUN" --log-failed 2>/dev/null | grep -q -- "--format long"; then
            FORMAT=long
          fi
          PRIVACY=unlisted
          gh workflow run paise-ki-pathshala.yml --ref main -f format="$FORMAT" -f privacy="$PRIVACY"
          echo "[WATCHDOG] repaired workflow dispatched: format=$FORMAT privacy=$PRIVACY"
