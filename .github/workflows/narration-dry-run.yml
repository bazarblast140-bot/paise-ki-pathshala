name: Narration dry run

# Live narration check. workflow_dispatch only.
# Picks N upcoming Short topics without marking them used, runs DeepSeek
# narration, beat repair, trim, and the text gates.
# full=true then speaks with free Edge TTS and renders final.mp4.
# No ElevenLabs key, no upload, no commit.
on:
  workflow_dispatch:
    inputs:
      topic_keys:
        description: "Comma-separated topic keys. Leave empty to narrate upcoming topics."
        type: string
        default: ""
      topics:
        description: "How many different upcoming topics to narrate"
        type: number
        default: 3
      beats:
        description: "four (~55s, default) or six. Overrides config.json live_beats."
        type: choice
        options: [four, six]
        default: four
      full:
        description: "Render final.mp4 with free Edge TTS. No ElevenLabs, no upload."
        type: boolean
        default: false
      narration_from_run:
        description: "Actions run id whose edge-dry-run script is spoken. No DeepSeek narration call."
        type: string
        default: ""
      overrides:
        description: "JSON object of beat replacements, applied before the voice hash lock."
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: narration-dry-run
  cancel-in-progress: false

jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and fonts
        if: ${{ inputs.full }}
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core libraqm0
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Download approved dry-run script
        if: ${{ inputs.narration_from_run != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python approved_script.py --download "${{ inputs.narration_from_run }}" --dest run/approved_script
      - name: Live narration check
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MAX_CALLS: "4"
          VIDEO_FORMAT: short
          DRY_RUN: "1"
          LIVE_BEATS: ${{ inputs.beats }}
        run: |
          ARGS=(--topics "${{ github.event.inputs.topics || 3 }}" --topic-keys "${{ github.event.inputs.topic_keys }}" --beats "${{ inputs.beats }}")
          if [ "${{ inputs.full }}" = "true" ] || [ -n "${{ inputs.narration_from_run }}" ]; then
            ARGS+=(--full)
          fi
          if [ -n "${{ inputs.narration_from_run }}" ]; then
            ARGS+=(--narration-from-run "${{ inputs.narration_from_run }}" --overrides "${{ inputs.overrides }}")
          fi
          python narration_dry_run.py "${ARGS[@]}"
      - name: Upload Edge dry-run video
        if: ${{ always() && (inputs.full || inputs.narration_from_run != '') }}
        uses: actions/upload-artifact@v4
        with:
          name: edge-dry-run
          path: |
            run/final_*.mp4
            run/tts_*.txt
            run/narration_*.json
          if-no-files-found: warn
