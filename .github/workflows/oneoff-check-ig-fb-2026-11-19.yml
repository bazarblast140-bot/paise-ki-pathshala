name: One-off IG/FB last-post check 2026-11-19 (check only, do not publish)
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: List last FB Page posts
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN || secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.error, traceback
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          IST=timezone(timedelta(hours=5,minutes=30))
          Path("run").mkdir(exist_ok=True)
          PAGE=os.environ.get("FB_PAGE_ID","").strip()
          T=os.environ.get("FB_ACCESS_TOKEN","")
          print("PAGE", PAGE, "token_len", len(T))
          def get(url):
            try:
              return json.loads(urllib.request.urlopen(url, timeout=60).read())
            except urllib.error.HTTPError as e:
              body=e.read().decode()[:800]
              print("HTTP", e.code, url.split("?")[0], body)
              return {"error":{"code":e.code,"body":body}}
          endpoints=[
            f"https://graph.facebook.com/v23.0/{PAGE}?fields=id,name,link&access_token={T}",
            f"https://graph.facebook.com/v23.0/{PAGE}/video_reels?fields=id,created_time,description,permalink_url,title&limit=12&access_token={T}",
            f"https://graph.facebook.com/v23.0/{PAGE}/videos?fields=id,created_time,description,permalink_url,title,length&limit=12&access_token={T}",
            f"https://graph.facebook.com/v23.0/{PAGE}/published_posts?fields=id,created_time,message,permalink_url,attachments&limit=12&access_token={T}",
          ]
          names=["page","video_reels","videos","published_posts"]
          for name,url in zip(names,endpoints):
            print("=======", name, "=======")
            try:
              data=get(url)
              Path(f"run/fb_{name}.json").write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding="utf-8")
              if name=="page":
                print({k:data.get(k) for k in ("id","name","link") if k in data or True})
                continue
              items=data.get("data") or []
              print("count", len(items), "keys", list(data.keys()))
              today=[]; last=None
              for it in items:
                ts=it.get("created_time")
                dt=None
                if ts:
                  try:
                    dt=datetime.strptime(ts, "%Y-%m-%dT%H:%M:%S%z").astimezone(IST)
                  except Exception as e:
                    print("parse_fail", ts, type(e).__name__)
                cap=(it.get("description") or it.get("title") or it.get("message") or "").splitlines()[:1]
                cap=cap[0][:80] if cap else ""
                print((dt.strftime("%Y-%m-%d %H:%M IST") if dt else ts), it.get("id"), it.get("permalink_url"), cap)
                if dt and last is None: last=dt
                if dt and dt.date().isoformat()=="2026-11-19":
                  today.append(it)
                blob=(it.get("description") or "")+" "+(it.get("title") or "")+" "+(it.get("message") or "")
                if any(s in blob for s in ["मारुति","13,345","13345","गोल्ड बॉन्ड आज"]):
                  print("POSSIBLE_DUP_FB", it.get("id"))
              if name in ("video_reels","videos","published_posts"):
                  print(name+"_TODAY_COUNT", len(today))
                  print(name+"_LAST", last.strftime("%Y-%m-%d %H:%M IST") if last else "none")
            except Exception:
              traceback.print_exc()
          PY
      - name: Upload check artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fb-lastpost-check-2026-11-19
          path: run/*.json
          if-no-files-found: warn
