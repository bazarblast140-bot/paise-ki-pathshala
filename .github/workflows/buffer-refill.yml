name: Buffer refill

on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: buffer-refill
  cancel-in-progress: false

jobs:
  refill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg & fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core libraqm0
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Build one buffer Short
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MAX_CALLS: "4"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BUFFER_FILL: "0"
          PUBLISH_VISIBILITY: unlisted
          PIPELINE_MODE: preview
          AUTOMATIC_UPLOAD: "1"
          REQUIRE_QA_APPROVAL: ${{ vars.REQUIRE_QA_APPROVAL || 'true' }}
        run: python buffer_shorts.py --refill
      - name: Commit manifest and topic bank
        if: always() && !cancelled()
        run: |
          FILES=""
          for f in data/buffer_manifest.json topic_bank.json; do
            [ -e "$f" ] && FILES="$FILES $f"
          done
          git add -N $FILES
          if git diff --quiet -- $FILES; then
            echo "No buffer changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add $FILES
            git commit -m "chore: buffer refill [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi
      - name: Upload buffer refill artifact
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: buffer-refill-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: run/final.mp4
      - name: QA artifact path
        if: always()
        run: |
          {
            echo "artifact: buffer-refill-${{ github.run_id }}"
            echo "final.mp4: run/final.mp4"
          } >> "$GITHUB_STEP_SUMMARY"
