name: Buffer refill

on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: buffer-refill
  cancel-in-progress: false

jobs:
  refill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg & fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core libraqm0
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Build one buffer Short
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MAX_CALLS: "4"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BUFFER_FILL: "0"
          PUBLISH_VISIBILITY: unlisted
          PIPELINE_MODE: preview
          AUTOMATIC_UPLOAD: "1"
          REQUIRE_QA_APPROVAL: ${{ vars.REQUIRE_QA_APPROVAL || 'true' }}
        run: |
          set -o pipefail
          mkdir -p run
          python buffer_shorts.py --refill 2>&1 | tee run/buffer_refill_last.log
      - name: Show why the refill failed (annotation, secrets stay masked)
        if: always()
        continue-on-error: true
        run: |
          f=run/buffer_refill_last.log
          if [ -s "$f" ]; then
            echo "::notice title=refill errors::$(grep -nE 'Error|Traceback|FAIL|BLOCK|File \"|rc=|raise|assert' "$f" | tail -n 14 | tr -cd '[:print:]\n' | tr '\n' '~' | cut -c1-1900)"
            echo "::notice title=refill log tail::$(tail -n 22 "$f" | tr -cd '[:print:]\n' | tr '\n' '~' | cut -c1-1900)"
          else
            echo "::notice title=refill log tail::no run/buffer_refill_last.log"
          fi
      - name: Show weak sync scenes (annotation)
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, re
          try:
              r = json.load(open("run/self_review.json", encoding="utf-8"))
              rows = [x for x in (r.get("sync") or {}).get("scenes", []) if float(x.get("recall") or 0) < 0.5]
              out = " ## ".join(f"{x.get('kind')} {x.get('recall')} SCRIPT: {x.get('script')} HEARD: {x.get('heard')}" for x in rows[:3])
          except Exception as e:
              out = f"no self_review: {e}"
          out = re.sub(r"[^\x20-\x7e]", "?", out)[:1800] if False else out[:1800]
          print("::notice title=weak sync::" + out.replace("\n", " "))
          PY
      - name: Commit manifest and topic bank
        if: always() && !cancelled()
        run: |
          FILES=""
          for f in data/buffer_manifest.json topic_bank.json; do
            [ -e "$f" ] && FILES="$FILES $f"
          done
          git add -N $FILES
          if git diff --quiet -- $FILES; then
            echo "No buffer changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add $FILES
            git commit -m "chore: buffer refill [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi
      - name: Upload buffer refill artifact
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: buffer-refill-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: run/final.mp4
      - name: QA artifact path
        if: always()
        run: |
          {
            echo "artifact: buffer-refill-${{ github.run_id }}"
            echo "final.mp4: run/final.mp4"
          } >> "$GITHUB_STEP_SUMMARY"
